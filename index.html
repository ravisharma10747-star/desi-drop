<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =====================================
   DESI DROP
   COMPLETE MULTIPLAYER CLIENT
===================================== */

const SERVER =
"https://desi-drop-server.onrender.com";

let socket;
let myId=null;
let started=false;

const scene=new THREE.Scene();

scene.background=
new THREE.Color(0x8dbbd5);

scene.fog=
new THREE.Fog(
 0x8dbbd5,
 100,
 850
);

const camera=
new THREE.PerspectiveCamera(
 65,
 innerWidth/innerHeight,
 .1,
 1500
);

const renderer=
new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});

renderer.setSize(
 innerWidth,
 innerHeight
);

renderer.setPixelRatio(
 Math.min(devicePixelRatio,1.5)
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
 renderer.domElement
);

/* =====================================
   LIGHT
===================================== */

scene.add(
 new THREE.HemisphereLight(
  0xbfeaff,
  0x435536,
  2
 )
);

const sun=
new THREE.DirectionalLight(
  0xffefc0,
  3
);

sun.position.set(
 -300,
 400,
 -200
);

sun.castShadow=true;

scene.add(sun);

/* =====================================
   MATERIALS
===================================== */

const grass=
new THREE.MeshLambertMaterial({
 color:0x609647
});

const dirt=
new THREE.MeshLambertMaterial({
 color:0x99734d
});

const road=
new THREE.MeshLambertMaterial({
 color:0x444444
});

const wall=
new THREE.MeshLambertMaterial({
 color:0xd0ad76
});

const roof=
new THREE.MeshLambertMaterial({
 color:0x863e2d
});

const tree=
new THREE.MeshLambertMaterial({
 color:0x286c31
});

const trunk=
new THREE.MeshLambertMaterial({
 color:0x654226
});

const white=
new THREE.MeshLambertMaterial({
 color:0xffffff
});

const field=
new THREE.MeshLambertMaterial({
 color:0x9ebc48
});

/* =====================================
   WORLD
===================================== */

const ground=
new THREE.Mesh(
 new THREE.PlaneGeometry(
  1200,
  900
 ),
 grass
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);

function cube(
 x,y,z,
 w,h,d,
 material
){

 const m=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   w,h,d
  ),
  material
 );

 m.position.set(
  x,y,z
 );

 m.castShadow=true;
 m.receiveShadow=true;

 scene.add(m);

 return m;
}

/* Main village roads */

cube(
 0,.04,0,
 1200,.08,65,
 dirt
);

cube(
 0,.05,0,
 55,.08,900,
 dirt
);

/* Highway */

cube(
 0,.06,300,
 1200,.12,85,
 road
);

/* Highway markings */

for(
 let x=-550;
 x<550;
 x+=55
){

 cube(
  x,.13,300,
 30,.03,2,
  white
 );

}

/* =====================================
   HOUSES
===================================== */

function house(x,z){

 const g=
 new THREE.Group();

 const body=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   42,26,36
  ),
  wall
 );

 body.position.y=13;
 body.castShadow=true;

 g.add(body);

 const r=
 new THREE.Mesh(
  new THREE.ConeGeometry(
   31,21,4
  ),
  roof
 );

 r.rotation.y=Math.PI/4;
 r.position.y=36;
 r.castShadow=true;

 g.add(r);

 g.position.set(
  x,0,z
 );

 scene.add(g);
}

[
 [-430,-220],
 [-330,-170],
 [-250,-260],
 [300,-240],
 [410,-180],
 [470,-260],
 [-430,160],
 [-340,230],
 [320,170],
 [430,230],
 [-250,350],
 [250,350]
].forEach(
 p=>house(p[0],p[1])
);

/* =====================================
   TREES
===================================== */

function makeTree(x,z){

 const g=
 new THREE.Group();

 const t=
 new THREE.Mesh(
  new THREE.CylinderGeometry(
   2.5,3,16,8
  ),
  trunk
 );

 t.position.y=8;
 t.castShadow=true;

 g.add(t);

 const c=
 new THREE.Mesh(
  new THREE.SphereGeometry(
   12,10,8
  ),
  tree
 );

 c.position.y=22;
 c.castShadow=true;

 g.add(c);

 g.position.set(
  x,0,z
 );

 scene.add(g);
}

for(let i=0;i<100;i++){

 const x=
 (Math.random()-.5)*1100;

 const z=
 (Math.random()-.5)*800;

 if(
  Math.abs(x)<65 ||
  Math.abs(z)<80
 ){

  i--;
  continue;

 }

 makeTree(x,z);
}

/* =====================================
   FARM FIELDS
===================================== */

for(let i=0;i<16;i++){

 const x=
 (Math.random()-.5)*1000;

 const z=
 (Math.random()-.5)*650;

 const f=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   100,
   .15,
   60
  ),
  field
 );

 f.position.set(
  x,.1,z
 );

 scene.add(f);
}

/* =====================================
   PLAYER
===================================== */

function playerModel(color){

 const g=
 new THREE.Group();

 const body=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   12,16,8
  ),
  new THREE.MeshLambertMaterial({
   color
  })
 );

 body.position.y=15;
 body.castShadow=true;

 g.add(body);

 const head=
 new THREE.Mesh(
  new THREE.SphereGeometry(
   6,12,10
  ),
  new THREE.MeshLambertMaterial({
   color:0xb97d50
  })
 );

 head.position.y=28;
 head.castShadow=true;

 g.add(head);

 const gun=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   3,3,18
  ),
  new THREE.MeshLambertMaterial({
   color:0x202020
  })
 );

 gun.position.set(
  7,15,-5
 );

 g.add(gun);

 return g;
}

const localMesh=
playerModel(0x315f36);

scene.add(localMesh);

const remote=
new Map();

/* =====================================
   PLAYER STATE
===================================== */

let me={
 x:0,
 z:0,
 hp:100,
 ammo:30,
 med:2,
 kills:0,
 alive:true,
 ax:0,
 az:-1
};

let players={};

let zone={
 x:0,
 z:0,
 r:450
};

/* =====================================
   CAMERA
===================================== */

let yaw=0;

function updateCamera(){

 if(!me.alive)return;

 const target=
 new THREE.Vector3(
  me.x,
  17,
  me.z
 );

 const distance=70;

 camera.position.lerp(
  new THREE.Vector3(
   me.x+
    Math.sin(yaw)*distance,
   38,
   me.z+
    Math.cos(yaw)*distance
  ),
  .12
 );

 camera.lookAt(target);
}

/* =====================================
   SERVER CONNECTION
===================================== */

function connect(){

 setStatus(
  "CONNECTING...",
  "#ffe36b"
 );

 socket=
 io(SERVER,{
  transports:[
   "websocket",
   "polling"
  ]
 });

 socket.on(
  "connect",
  ()=>{

   setStatus(
    "CONNECTED",
    "#65ff7b"
   );

   socket.emit(
    "join",
    {
     name:
      document.getElementById(
       "name"
      ).value.trim() ||
      "Desi Player"
    }
   );

  }
 );

 socket.on(
  "welcome",
  d=>{
   myId=d.id;
  }
 );

 socket.on(
  "joined",
  ()=>{
   message(
    "WELCOME TO DESI DROP",
    1500
   );
  }
 );

 socket.on(
  "state",
  state=>{
   receiveState(state);
  }
 );

 socket.on(
  "gameover",
  data=>{
   endGame(data);
  }
 );

 socket.on(
  "disconnect",
  ()=>{
   setStatus(
    "DISCONNECTED",
    "#ff6464"
   );
  }
 );

 socket.on(
  "connect_error",
  ()=>{
   setStatus(
    "SERVER ERROR",
    "#ff6464"
   );
  }
 );
}

function setStatus(
 text,
 color
){

 const e=
 document.getElementById(
  "connection"
 );

 e.textContent=text;
 e.style.color=color;
}

/* =====================================
   RECEIVE SERVER STATE
===================================== */

function receiveState(data){

 players=
 data.players||{};

 if(data.safe){

  zone=data.safe;

 }

 const p=
 players[myId];

 if(p){

  me.x=p.x;
  me.z=p.z;
  me.hp=p.hp;
  me.ammo=p.ammo;
  me.med=p.med;
  me.kills=p.kills;
  me.alive=p.alive;
  me.ax=p.ax;
  me.az=p.az;

 }

 updateRemotePlayers();
 updateHUD();

}

/* =====================================
   REMOTE PLAYERS
===================================== */

function updateRemotePlayers(){

 const seen=
 new Set();

 for(
  const id in players
 ){

  if(id===myId)
   continue;

  const p=
  players[id];

  seen.add(id);

  let m=
  remote.get(id);

  if(!m){

   m=
   playerModel(
    0x8b4032
   );

   remote.set(
    id,m
   );

   scene.add(m);

  }

  m.visible=p.alive;

  m.position.set(
   p.x,
   0,
   p.z
  );

  m.rotation.y=
   Math.atan2(
    p.ax,
    p.az
   );

 }

 for(
  const [id,m]
  of remote
 ){

  if(!seen.has(id)){

   scene.remove(m);
   remote.delete(id);

  }
 }
}

/* =====================================
   LOCAL VISUAL
===================================== */

function updateLocal(){

 localMesh.visible=
  me.alive;

 localMesh.position.set(
  me.x,
  0,
  me.z
 );

 localMesh.rotation.y=
  Math.atan2(
   me.ax,
   me.az
  );
}

/* =====================================
   HUD
===================================== */

function updateHUD(){

 document.getElementById(
  "hp"
 ).textContent=
  Math.round(me.hp);

 document.getElementById(
  "ammo"
 ).textContent=
  me.ammo;

 document.getElementById(
  "kills"
 ).textContent=
  me.kills;

 document.getElementById(
  "health"
 ).style.width=
  Math.max(
   0,
   me.hp
  )+"%";

 document.getElementById(
  "healthText"
 ).textContent=
  Math.round(me.hp)+" HP";

 document.getElementById(
  "alive"
 ).textContent=
  Object.values(players)
  .filter(
   p=>p.alive
  ).length;

 document.getElementById(
  "zone"
 ).textContent=
  Math.round(zone.r);

}

/* =====================================
   JOYSTICK
===================================== */

const joy=
document.getElementById(
 "joystick"
);

const stick=
document.getElementById(
 "stick"
);

let mx=0;
let mz=0;
let joyOn=false;

function moveJoy(
 x,y
){

 const r=
 joy.getBoundingClientRect();

 const cx=
 r.left+r.width/2;

 const cy=
 r.top+r.height/2;

 let dx=x-cx;
 let dy=y-cy;

 const max=45;

 const len=
 Math.hypot(dx,dy);

 if(len>max){

  dx=dx/len*max;
  dy=dy/len*max;

 }

 mx=dx/max;
 mz=dy/max;

 stick.style.transform=
  `translate(${dx}px,${dy}px)`;
}

function resetJoy(){

 joyOn=false;
 mx=0;
 mz=0;

 stick.style.transform=
  "translate(0,0)";
}

joy.addEventListener(
 "pointerdown",
 e=>{

  joyOn=true;

  joy.setPointerCapture(
   e.pointerId
  );

  moveJoy(
   e.clientX,
   e.clientY
  );
 }
);

joy.addEventListener(
 "pointermove",
 e=>{

  if(joyOn)
   moveJoy(
    e.clientX,
    e.clientY
   );

 }
);

joy.addEventListener(
 "pointerup",
 resetJoy
);

joy.addEventListener(
 "pointercancel",
 resetJoy
);

/* =====================================
   LOOK / AIM
===================================== */

const look=
document.getElementById(
 "look"
);

let looking=false;
let lastX=0;

look.addEventListener(
 "pointerdown",
 e=>{

  looking=true;
  lastX=e.clientX;

  look.setPointerCapture(
   e.pointerId
  );
 }
);

look.addEventListener(
 "pointermove",
 e=>{

  if(!looking)return;

  const dx=
   e.clientX-lastX;

  yaw-=dx*.008;

  lastX=e.clientX;

 }
);

look.addEventListener(
 "pointerup",
 ()=>looking=false
);

look.addEventListener(
 "pointercancel",
 ()=>looking=false
);

/* =====================================
   FIRE
===================================== */

let firing=false;

const fire=
document.getElementById(
 "fire"
);

fire.addEventListener(
 "pointerdown",
 e=>{
  e.preventDefault();
  firing=true;
 }
);

fire.addEventListener(
 "pointerup",
 ()=>{
  firing=false;
 }
);

fire.addEventListener(
 "pointercancel",
 ()=>{
  firing=false;
 }
);

fire.addEventListener(
 "pointerleave",
 ()=>{
  firing=false;
 }
);

/* =====================================
   RELOAD
===================================== */

document
.getElementById("reload")
.addEventListener(
 "pointerdown",
 ()=>{
  if(socket)
   socket.emit("reload");

  message(
   "RELOADING",
   800
  );
 }
);

/* =====================================
   MEDKIT
===================================== */

document
.getElementById("med")
.addEventListener(
 "pointerdown",
 ()=>{
  if(socket)
   socket.emit("heal");
 }
);

/* =====================================
   AIM
===================================== */

document
.getElementById("aim")
.addEventListener(
 "pointerdown",
 ()=>{
  message(
   "AIM",
   400
  );
 }
);

/* =====================================
   SEND INPUT
===================================== */

function sendInput(){

 if(!socket)return;
 if(!socket.connected)return;
 if(!me.alive)return;

 let dx=mx;
 let dz=mz;

 const len=
 Math.hypot(dx,dz);

 if(len>1){

  dx/=len;
  dz/=len;

 }

 const worldX=
  dx*Math.cos(yaw)-
  dz*Math.sin(yaw);

 const worldZ=
  dx*Math.sin(yaw)+
  dz*Math.cos(yaw);

 const ax=
  Math.sin(yaw);

 const az=
  Math.cos(yaw);

 socket.emit(
  "input",
  {
   dx:worldX,
   dz:worldZ,
   ax:ax,
   az:az,
   shoot:firing
  }
 );
}

/* =====================================
   MESSAGE
===================================== */

let msgTimer;

function message(
 text,
 duration=1000
){

 const e=
 document.getElementById(
  "message"
 );

 e.textContent=text;
 e.style.opacity=1;

 clearTimeout(msgTimer);

 msgTimer=
 setTimeout(
  ()=>{
   e.style.opacity=0;
  },
  duration
 );
}

/* =====================================
   GAME OVER
===================================== */

function endGame(data){

 firing=false;

 document.getElementById(
  "gameover"
 ).style.display=
  "flex";

 document.getElementById(
  "result"
 ).textContent=
  data.win ?
   "🏆 YOU WIN!" :
   "☠️ YOU LOST";

 document.getElementById(
  "resultText"
 ).innerHTML=
  `
  ${data.text||"Battle finished."}
  <br><br>
  ☠️ Kills: ${me.kills}
  <br>
  ❤️ Health: ${Math.round(me.hp)}
  `;

}

/* =====================================
   START
===================================== */

document
.getElementById("play")
.addEventListener(
 "click",
 ()=>{

  if(started)return;

  started=true;

  document.getElementById(
   "menu"
  ).style.display="none";

  connect();

 }
);

/* =====================================
   GAME LOOP
===================================== */

let last=
 performance.now();

function loop(){

 requestAnimationFrame(
  loop
 );

 const now=
  performance.now();

 if(started){

  if(now-last>50){

   last=now;

   sendInput();

  }

  updateLocal();
  updateCamera();

 }

 renderer.render(
  scene,
  camera
 );
}

loop();

/* =====================================
   RESIZE
===================================== */

window.addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/
   innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );

 }
);

/* =====================================
   STARTUP
===================================== */

setTimeout(
 ()=>{

  document.getElementById(
   "loading"
  ).style.display="none";

  document.getElementById(
   "menu"
  ).style.display="flex";

 },
 900
);

</script>

</body>
</html>
