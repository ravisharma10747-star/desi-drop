<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>DESI DROP</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
    color:white;
    font-weight:bold;
    text-shadow:0 2px 4px black;
}

.top{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
}

.hudBox{
    background:rgba(0,0,0,.55);
    padding:9px 12px;
    border-radius:10px;
    font-size:14px;
}

#zoneInfo{
    position:absolute;
    top:58px;
    left:12px;
    background:rgba(0,0,0,.55);
    padding:7px 10px;
    border-radius:9px;
    font-size:12px;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:27px;
}

#playerName{
    position:absolute;
    left:50%;
    bottom:18%;
    transform:translateX(-50%);
    font-size:12px;
}

#controls{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}

#joystick{
    position:absolute;
    left:20px;
    bottom:25px;
    width:125px;
    height:125px;
    border-radius:50%;
    background:rgba(0,0,0,.30);
    border:2px solid rgba(255,255,255,.35);
    pointer-events:auto;
}

#stick{
    position:absolute;
    left:34px;
    top:34px;
    width:54px;
    height:54px;
    border-radius:50%;
    background:rgba(255,255,255,.55);
}

.controlButton{
    position:absolute;
    pointer-events:auto;
    color:white;
    font-weight:bold;
    border:2px solid rgba(255,255,255,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    user-select:none;
}

#fireButton{
    right:22px;
    bottom:38px;
    width:96px;
    height:96px;
    border-radius:50%;
    background:rgba(190,35,35,.65);
}

#aimButton{
    right:135px;
    bottom:46px;
    width:68px;
    height:68px;
    border-radius:50%;
    background:rgba(30,30,30,.65);
    font-size:11px;
}

#medButton{
    right:130px;
    bottom:125px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:rgba(30,145,75,.65);
    font-size:11px;
}

#reloadButton{
    right:22px;
    bottom:148px;
    width:96px;
    height:44px;
    border-radius:12px;
    background:rgba(30,30,30,.70);
    font-size:12px;
}

.screen{
    position:fixed;
    inset:0;
    z-index:50;
    background:
        linear-gradient(
            rgba(10,18,9,.88),
            rgba(3,7,3,.96)
        );
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    color:white;
}

.screen h1{
    margin:0;
    font-size:52px;
    letter-spacing:4px;
}

.screen h2{
    margin:7px 0;
    font-size:19px;
}

.screen p{
    max-width:330px;
    color:#c9d5c3;
    line-height:1.5;
}

.screen input{
    width:230px;
    padding:14px;
    border:0;
    border-radius:12px;
    text-align:center;
    font-size:16px;
    margin:8px;
    outline:none;
}

.screen button{
    padding:15px 28px;
    border:0;
    border-radius:13px;
    background:#20b45a;
    color:white;
    font-size:17px;
    font-weight:bold;
    box-shadow:0 4px 0 #087638;
}

#status{
    margin-top:13px;
    font-size:12px;
    color:#bce5c0;
}

.hidden{
    display:none !important;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- HUD -->

<div id="hud">

    <div class="top">

        <div class="hudBox">
            ❤️ <span id="hp">100</span>
            &nbsp;&nbsp;
            🔫 <span id="ammo">30</span>
        </div>

        <div class="hudBox">
            ☠️ <span id="kills">0</span>
            &nbsp;&nbsp;
            👥 <span id="alive">0</span>
        </div>

    </div>

    <div id="zoneInfo">
        ZONE: <span id="zone">900</span>m
    </div>

    <div id="crosshair">
        +
    </div>

    <div id="playerName">
        DESI PLAYER
    </div>

</div>


<!-- MOBILE CONTROLS -->

<div id="controls">

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div
        id="fireButton"
        class="controlButton">
        FIRE
    </div>

    <div
        id="aimButton"
        class="controlButton">
        AIM
    </div>

    <div
        id="medButton"
        class="controlButton">
        MED
    </div>

    <div
        id="reloadButton"
        class="controlButton">
        RELOAD
    </div>

</div>


<!-- START SCREEN -->

<div id="startScreen" class="screen">

    <h1>DESI DROP</h1>

    <h2>
        OLD-SCHOOL BATTLE ROYALE
    </h2>

    <p>
        Third-person battle royale with
        Indian village, farms, roads,
        weapons, loot and multiplayer.
    </p>

    <input
        id="nameInput"
        maxlength="16"
        placeholder="Enter player name">

    <button id="joinButton">
        JOIN BATTLE
    </button>

    <div id="status">
        Connecting...
    </div>

</div>


<!-- GAME OVER -->

<div id="endScreen" class="screen hidden">

    <h1 id="resultTitle">
        GAME OVER
    </h1>

    <h2 id="resultText">
        You were eliminated.
    </h2>

    <button id="againButton">
        PLAY AGAIN
    </button>

</div>


<!-- SOCKET.IO -->

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>


<script type="module">

/* =========================================================
   DESI DROP
   CLIENT GAME
   ========================================================= */


/* ---------------------------------------------------------
   SERVER URL
   --------------------------------------------------------- */

const SERVER_URL =
    "YOUR_RENDER_SERVER_URL";


/* ---------------------------------------------------------
   THREE.JS
   --------------------------------------------------------- */

import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* ---------------------------------------------------------
   DOM
   --------------------------------------------------------- */

const canvas =
    document.getElementById("game");

const startScreen =
    document.getElementById("startScreen");

const endScreen =
    document.getElementById("endScreen");

const joinButton =
    document.getElementById("joinButton");

const againButton =
    document.getElementById("againButton");

const nameInput =
    document.getElementById("nameInput");

const statusText =
    document.getElementById("status");

const hpText =
    document.getElementById("hp");

const ammoText =
    document.getElementById("ammo");

const killsText =
    document.getElementById("kills");

const aliveText =
    document.getElementById("alive");

const zoneText =
    document.getElementById("zone");

const playerNameText =
    document.getElementById("playerName");


/* ---------------------------------------------------------
   THREE SCENE
   --------------------------------------------------------- */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x8fb46b);

scene.fog =
    new THREE.Fog(
        0x8fb46b,
        80,
        480
    );


/* ---------------------------------------------------------
   CAMERA
   --------------------------------------------------------- */

const camera =
    new THREE.PerspectiveCamera(
        62,
        innerWidth / innerHeight,
        0.1,
        900
    );


/* ---------------------------------------------------------
   RENDERER
   --------------------------------------------------------- */

const renderer =
    new THREE.WebGLRenderer({
        canvas:canvas,
        antialias:true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);


/* ---------------------------------------------------------
   LIGHTING
   --------------------------------------------------------- */

const skyLight =
    new THREE.HemisphereLight(
        0xd7edff,
        0x405d2d,
        2
    );

scene.add(skyLight);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2.3
    );

sun.position.set(
    120,
    200,
    100
);

scene.add(sun);


/* ---------------------------------------------------------
   WORLD
   --------------------------------------------------------- */

const WORLD_WIDTH = 1200;
const WORLD_DEPTH = 900;


/* ---------------------------------------------------------
   MATERIAL HELPER
   --------------------------------------------------------- */

function material(color){

    return new THREE.MeshStandardMaterial({
        color:color,
        roughness:.9
    });

}


/* ---------------------------------------------------------
   BOX HELPER
   --------------------------------------------------------- */

function createBox(
    width,
    height,
    depth,
    color
){

    return new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            height,
            depth
        ),
        material(color)
    );

}


/* ---------------------------------------------------------
   CYLINDER HELPER
   --------------------------------------------------------- */

function createCylinder(
    radius,
    height,
    color
){

    return new THREE.Mesh(
        new THREE.CylinderGeometry(
            radius,
            radius,
            height,
            10
        ),
        material(color)
    );

}


/* =========================================================
   GROUND
   ========================================================= */

const ground =
    createBox(
        WORLD_WIDTH,
        .5,
        WORLD_DEPTH,
        0x78a653
    );

ground.position.y = -.25;

scene.add(ground);


/* =========================================================
   ROADS
   ========================================================= */

const mainRoad =
    createBox(
        WORLD_WIDTH + 50,
        .08,
        130,
        0xbba56e
    );

mainRoad.position.y = .04;

scene.add(mainRoad);


const crossRoad =
    createBox(
        130,
        .08,
        WORLD_DEPTH + 50,
        0xc5b37e
    );

crossRoad.position.y = .045;

scene.add(crossRoad);


/* ROAD MARKINGS */

for(
    let x = -570;
    x < 570;
    x += 75
){

    const mark =
        createBox(
            30,
            .09,
            4,
            0xe9dca8
        );

    mark.position.set(
        x,
        .09,
        0
    );

    scene.add(mark);

}


for(
    let z = -420;
    z < 420;
    z += 75
){

    const mark =
        createBox(
            4,
            .09,
            30,
            0xe9dca8
        );

    mark.position.set(
        0,
        .09,
        z
    );

    scene.add(mark);

}


/* =========================================================
   HOUSES
   ========================================================= */

function createHouse(
    x,
    z
){

    const house =
        createBox(
            48,
            30,
            40,
            0xe1c697
        );

    house.position.set(
        x,
        15,
        z
    );

    scene.add(house);


    const roof =
        createBox(
            55,
            4,
            47,
            0x873d2e
        );

    roof.position.set(
        x,
        32,
        z
    );

    scene.add(roof);


    const door =
        createBox(
            8,
            15,
            1.5,
            0x553622
        );

    door.position.set(
        x,
        7.5,
        z - 20.5
    );

    scene.add(door);


    const window =
        createBox(
            9,
            8,
            1.3,
            0x5f91a4
        );

    window.position.set(
        x - 14,
        16,
        z - 20.5
    );

    scene.add(window);

}


/* CREATE VILLAGE */

for(
    let i = 0;
    i < 25;
    i++
){

    const x =
        ((i * 173) % 1000) - 500;

    const z =
        ((i * 97) % 720) - 360;


    if(
        Math.abs(x) < 100 ||
        Math.abs(z) < 100
    ){

        continue;

    }

    createHouse(x,z);

}


/* =========================================================
   TREES
   ========================================================= */

for(
    let i = 0;
    i < 90;
    i++
){

    const x =
        ((i * 131) % 1100) - 550;

    const z =
        ((i * 211) % 800) - 400;


    if(
        Math.abs(x) < 90 &&
        Math.abs(z) < 90
    ){

        continue;

    }


    const trunk =
        createCylinder(
            1.6,
            8,
            0x67452c
        );

    trunk.position.set(
        x,
        4,
        z
    );

    scene.add(trunk);


    const leaves =
        createCylinder(
            6,
            10,
            0x2e6732
        );

    leaves.position.set(
        x,
        11,
        z
    );

    scene.add(leaves);

}


/* =========================================================
   FIELDS
   ========================================================= */

for(
    let i = 0;
    i < 16;
    i++
){

    const x =
        ((i * 257) % 1000) - 500;

    const z =
        ((i * 151) % 600) - 300;


    if(
        Math.abs(x) < 120
    ){

        continue;

    }


    const field =
        createBox(
            120,
            .08,
            90,
            0x9ac56a
        );

    field.position.set(
        x,
        .05,
        z
    );

    scene.add(field);

}


/* =========================================================
   PLAYER MESH
   ========================================================= */

function createPlayerMesh(
    mine
){

    const group =
        new THREE.Group();


    /* BODY */

    const body =
        createCylinder(
            2.7,
            7,
            mine
                ? 0x147bd1
                : 0xd84a3d
        );

    body.position.y = 4.5;

    group.add(body);


    /* HEAD */

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                2.2,
                12,
                8
            ),
            material(0xd5a275)
        );

    head.position.y = 9.5;

    group.add(head);


    /* GUN */

    const gun =
        createBox(
            1.2,
            1.2,
            7,
            0x242424
        );

    gun.position.set(
        0,
        6,
        -4.5
    );

    group.add(gun);


    scene.add(group);

    return group;

}


/* =========================================================
   MULTIPLAYER STATE
   ========================================================= */

let socket = null;

let connected = false;

let joined = false;

let myId = null;

let state = {

    players:{},

    bullets:[],

    loot:[],

    safe:{
        x:0,
        z:0,
        r:450
    }

};

const playerMeshes =
    new Map();


/* =========================================================
   PLAYER INPUT STATE
   ========================================================= */

let keys = {};

let shooting = false;

let aiming = false;

let joystickX = 0;

let joystickY = 0;

let aimX = 0;

let aimZ = -1;


/* =========================================================
   CONNECT TO SERVER
   ========================================================= */

function connectServer(){

    if(
        SERVER_URL.includes(
            "YOUR_RENDER"
        )
    ){

        statusText.textContent =
            "Multiplayer server not connected yet";

        return;

    }


    socket =
        io(
            SERVER_URL,
            {
                transports:[
                    "websocket",
                    "polling"
                ]
            }
        );


    socket.on(
        "connect",
        function(){

            connected = true;

            statusText.textContent =
                "Connected — enter your name";

        }
    );


    socket.on(
        "disconnect",
        function(){

            connected = false;
            joined = false;

            statusText.textContent =
                "Server disconnected";

        }
    );


    socket.on(
        "connect_error",
        function(){

            statusText.textContent =
                "Unable to connect to server";

        }
    );


    socket.on(
        "welcome",
        function(data){

            myId = data.id;

        }
    );


    socket.on(
        "joined",
        function(){

            joined = true;

            startScreen
                .classList
                .add("hidden");

        }
    );


    socket.on(
        "state",
        function(data){

            state = data;

            updatePlayerMeshes();

            updateHUD();

        }
    );


    socket.on(
        "gameover",
        function(data){

            joined = false;

            endScreen
                .classList
                .remove("hidden");


            document
                .getElementById("resultTitle")
                .textContent =
                data.win
                    ? "🏆 BOOYAH!"
                    : "💀 ELIMINATED";


            document
                .getElementById("resultText")
                .textContent =
                data.text ||
                "Battle ended.";

        }
    );

}


connectServer();


/* =========================================================
   JOIN
   ========================================================= */

joinButton.addEventListener(
    "click",
    function(){

        if(
            !socket ||
            !connected
        ){

            statusText.textContent =
                "Waiting for multiplayer server";

            return;

        }


        let name =
            nameInput
                .value
                .trim();


        if(!name){

            name =
                "Desi Player";

        }


        name =
            name
                .substring(
                    0,
                    16
                );


        socket.emit(
            "join",
            {
                name:name
            }
        );

    }
);


/* =========================================================
   SEND INPUT
   ========================================================= */

function sendInput(){

    if(
        !socket ||
        !joined
    ){

        return;

    }


    let dx =
        joystickX;

    let dz =
        joystickY;


    if(
        keys["a"] ||
        keys["ArrowLeft"]
    ){

        dx -= 1;

    }


    if(
        keys["d"] ||
        keys["ArrowRight"]
    ){

        dx += 1;

    }


    if(
        keys["w"] ||
        keys["ArrowUp"]
    ){

        dz -= 1;

    }


    if(
        keys["s"] ||
        keys["ArrowDown"]
    ){

        dz += 1;

    }


    const length =
        Math.hypot(
            dx,
            dz
        );


    if(length > 1){

        dx /= length;
        dz /= length;

    }


    socket.emit(
        "input",
        {
            dx:dx,
            dz:dz,
            ax:aimX,
            az:aimZ,
            shoot:shooting
        }
    );

}


/* =========================================================
   UPDATE PLAYER MESHES
   ========================================================= */

function updatePlayerMeshes(){

    const active =
        new Set(
            Object.keys(
                state.players
            )
        );


    for(
        const [id,mesh]
        of playerMeshes
    ){

        if(
            !active.has(id)
        ){

            scene.remove(mesh);

            playerMeshes.delete(id);

        }

    }


    for(
        const id
        in state.players
    ){

        const p =
            state.players[id];


        if(!p.alive){

            continue;

        }


        let mesh =
            playerMes
