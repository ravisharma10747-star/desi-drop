<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DESI DROP — Island Map</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101820;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
}

#loading{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#111820;
  color:white;
}

#loading h1{
  margin:0 0 10px;
  font-size:38px;
  letter-spacing:4px;
}

#loading p{
  opacity:.75;
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:10;
}

#title{
  position:absolute;
  top:14px;
  left:16px;
  color:white;
  font-weight:900;
  font-size:18px;
  letter-spacing:2px;
  text-shadow:0 2px 5px #000;
}

#location{
  position:absolute;
  top:45px;
  left:16px;
  color:white;
  font-size:13px;
  text-shadow:0 2px 5px #000;
}

#map{
  position:absolute;
  top:12px;
  right:12px;
  width:145px;
  height:145px;
  border:3px solid rgba(255,255,255,.8);
  border-radius:8px;
  background:rgba(20,50,45,.75);
  overflow:hidden;
}

#mapCanvas{
  width:100%;
  height:100%;
}

#controls{
  position:absolute;
  left:20px;
  bottom:25px;
  width:145px;
  height:145px;
  border-radius:50%;
  background:rgba(0,0,0,.22);
  border:2px solid rgba(255,255,255,.3);
  pointer-events:auto;
}

#stick{
  position:absolute;
  width:58px;
  height:58px;
  left:43px;
  top:43px;
  border-radius:50%;
  background:rgba(255,255,255,.55);
  border:2px solid rgba(255,255,255,.8);
}

#look{
  position:absolute;
  right:0;
  top:0;
  width:52%;
  height:75%;
  pointer-events:auto;
}

#hint{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 13px;
  border-radius:8px;
  color:white;
  background:rgba(0,0,0,.45);
  font-size:12px;
  white-space:nowrap;
}

#legend{
  position:absolute;
  left:16px;
  top:78px;
  color:white;
  font-size:11px;
  line-height:18px;
  text-shadow:0 2px 4px #000;
}

#start{
  position:fixed;
  z-index:30;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(8,13,18,.94);
  color:white;
}

.startBox{
  width:min(90%,420px);
  text-align:center;
}

.startBox h1{
  font-size:44px;
  margin:0;
  letter-spacing:5px;
}

.startBox h2{
  margin:8px 0 28px;
  font-size:15px;
  font-weight:normal;
  opacity:.7;
}

button{
  width:100%;
  padding:17px;
  border:0;
  border-radius:12px;
  font-size:18px;
  font-weight:900;
  background:#e9b949;
  color:#151515;
}

#desktop{
  display:none;
}

@media (min-width:700px){
  #desktop{
    display:block;
    position:absolute;
    bottom:20px;
    right:20px;
    color:white;
    background:rgba(0,0,0,.45);
    padding:10px 14px;
    border-radius:8px;
    font-size:13px;
  }

  #hint{
    display:none;
  }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
  <h1>DESI DROP</h1>
  <p>Building island...</p>
</div>

<div id="start">
  <div class="startBox">
    <h1>DESI DROP</h1>
    <h2>CLASSIC ISLAND MAP EXPLORER</h2>
    <button id="startBtn">ENTER ISLAND</button>
  </div>
</div>

<div id="hud">

  <div id="title">DESI DROP</div>
  <div id="location">KARAULI ISLAND</div>

  <div id="legend">
    🟢 Grassland<br>
    🟫 Roads<br>
    🏠 Villages<br>
    🏭 Industrial area<br>
    🔵 Water
  </div>

  <div id="map">
    <canvas id="mapCanvas" width="290" height="290"></canvas>
  </div>

  <div id="controls">
    <div id="stick"></div>
  </div>

  <div id="look"></div>

  <div id="hint">
    MOVE WITH JOYSTICK • DRAG RIGHT SIDE TO LOOK
  </div>

  <div id="desktop">
    W A S D = MOVE &nbsp; • &nbsp; MOUSE DRAG = LOOK
  </div>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const loading = document.getElementById("loading");
const start = document.getElementById("start");
const startBtn = document.getElementById("startBtn");
const locationText = document.getElementById("location");

let scene;
let camera;
let renderer;
let player;
let playerBody;
let clock;

let yaw = 0;
let pitch = -0.18;

const keys = {
  w:false,
  a:false,
  s:false,
  d:false
};

const joystick = {
  active:false,
  x:0,
  y:0,
  id:null
};

const look = {
  active:false,
  id:null,
  x:0,
  y:0
};

const MAP_W = 1800;
const MAP_D = 1400;

const mapCanvas = document.getElementById("mapCanvas");
const mapCtx = mapCanvas.getContext("2d");

const locations = [
  {name:"Karauli City",x:-420,z:-270},
  {name:"Old Town",x:-720,z:80},
  {name:"Industrial Yard",x:350,z:-420},
  {name:"Power Station",x:610,z:100},
  {name:"Mandrayal Village",x:-360,z:420},
  {name:"Temple Hills",x:80,z:430},
  {name:"Harbour",x:650,z:430},
  {name:"Riverside",x:300,z:650},
  {name:"Farm Belt",x:-620,z:500},
  {name:"Dry Valley",x:650,z:-550}
];

function mat(color){
  return new THREE.MeshStandardMaterial({
    color:color,
    roughness:.9,
    metalness:0
  });
}

const grassMat = mat(0x527c3d);
const dirtMat = mat(0x9a7447);
const roadMat = mat(0x3b3b38);
const roofMat = mat(0x8c4b32);
const wallMat = mat(0xc8aa7a);
const concreteMat = mat(0x777b78);
const waterMat = new THREE.MeshStandardMaterial({
  color:0x286c82,
  roughness:.4,
  metalness:.1,
  transparent:true,
  opacity:.92
});

function box(w,h,d,material,x,y,z){
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material
  );
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function cylinder(r,h,material,x,y,z){
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(r,r,h,10),
    material
  );
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function createGround(){

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(MAP_W,MAP_D,60,60),
    grassMat
  );

  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;

  scene.add(ground);

  const water = new THREE.Mesh(
    new THREE.PlaneGeometry(2400,2100),
    waterMat
  );

  water.rotation.x = -Math.PI/2;
  water.position.y = -1.8;

  scene.add(water);

  // Island shape using large grass patches
  const island = new THREE.Mesh(
    new THREE.CylinderGeometry(
      870,
      920,
      7,
      48
    ),
    grassMat
  );

  island.scale.z = .77;
  island.position.y = -2;
  island.receiveShadow = true;

  scene.add(island);

  // beaches
  const beachMat = mat(0xc9b878);

  const beach = new THREE.Mesh(
    new THREE.CylinderGeometry(
      900,
      900,
      2,
      48
    ),
    beachMat
  );

  beach.scale.z = .77;
  beach.position.y = -1;
  scene.add(beach);

  const innerIsland = new THREE.Mesh(
    new THREE.CylinderGeometry(
      875,
      875,
      5,
      48
    ),
    grassMat
  );

  innerIsland.scale.z = .77;
  innerIsland.position.y = 0;
  innerIsland.receiveShadow = true;

  scene.add(innerIsland);
}

function createRoad(x,z,w,d,rotation=0){

  const r = box(
    w,
    .08,
    d,
    roadMat,
    x,
    .04,
    z
  );

  r.rotation.y = rotation;

  // road edge
  const edgeMat = mat(0x706b58);

  const e1 = box(
    w,
    .025,
    2,
    edgeMat,
    x,
    .09,
    z-d/2+4
  );

  e1.rotation.y = rotation;

  const e2 = box(
    w,
    .025,
    2,
    edgeMat,
    x,
    .09,
    z+d/2-4
  );

  e2.rotation.y = rotation;
}

function createHouse(x,z,scale=1){

  const w = 32*scale;
  const d = 25*scale;
  const h = 18*scale;

  box(
    w,
    h,
    d,
    wallMat,
    x,
    h/2,
    z
  );

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(
      25*scale,
      14*scale,
      4
    ),
    roofMat
  );

  roof.rotation.y = Math.PI/4;
  roof.position.set(x,h+6*scale,z);
  roof.castShadow = true;

  scene.add(roof);

  // door
  box(
    6*scale,
    10*scale,
    .5,
    concreteMat,
    x,
    5*scale,
    z-d/2-.4
  );

  // windows
  box(
    6*scale,
    5*scale,
    .5,
    mat(0x314d59),
    x-w*.25,
    h*.55,
    z-d/2-.5
  );

  box(
    6*scale,
    5*scale,
    .5,
    mat(0x314d59),
    x+w*.25,
    h*.55,
    z-d/2-.5
  );
}

function createWarehouse(x,z,w=90,d=55){

  box(
    w,
    32,
    d,
    concreteMat,
    x,
    16,
    z
  );

  const roof = box(
    w+4,
    4,
    d+4,
    mat(0x4b514d),
    x,
    34,
    z
  );

  // front doors
  for(let i=-1;i<=1;i++){

    box(
      15,
      23,
      1,
      mat(0x353a38),
      x+i*24,
      12,
      z-d/2-1
    );
  }
}

function createFactory(x,z){

  createWarehouse(x,z,120,75);

  cylinder(
    17,
    70,
    concreteMat,
    x+65,
    35,
    z
  );

  cylinder(
    13,
    5,
    mat(0x454845),
    x+65,
    70,
    z
  );

  for(let i=0;i<4;i++){

    box(
      9,
      9,
      9,
      mat(0x555a56),
      x-70+i*28,
      4.5,
      z+65
    );
  }
}

function createTrees(){

  const trunkMat = mat(0x63432a);
  const leafMat = mat(0x2d642f);

  for(let i=0;i<170;i++){

    const angle = Math.random()*Math.PI*2;
    const radius = 100 + Math.random()*720;

    let x = Math.cos(angle)*radius;
    let z = Math.sin(angle)*radius*.77;

    // Keep central roads/areas more open
    if(Math.abs(x)<120 && Math.abs(z)<120){
      i--;
      continue;
    }

    const trunk = cylinder(
      2,
      12,
      trunkMat,
      x,
      6,
      z
    );

    const crown = new THREE.Mesh(
      new THREE.SphereGeometry(
        9+Math.random()*5,
        8,
        7
      ),
      leafMat
    );

    crown.position.set(
      x,
      17,
      z
    );

    crown.castShadow = true;

    scene.add(crown);
  }
}

function createHills(){

  const hillMat = mat(0x466a39);

  const hills = [
    [-620,-520,120],
    [-520,-500,90],
    [40,-500,150],
    [270,-510,120],
    [520,280,130],
    [-40,510,170],
    [-500,330,120],
    [620,-130,110]
  ];

  hills.forEach(h=>{

    const m = new THREE.Mesh(
      new THREE.SphereGeometry(
        h[2],
        20,
        12
      ),
      hillMat
    );

    m.scale.y=.55;
    m.position.set(h[0],h[2]*.22,h[1]);

    m.castShadow=true;
    m.receiveShadow=true;

    scene.add(m);
  });
}

function createBridge(){

  const bridgeMat = mat(0x555958);

  box(
    230,
    4,
    45,
    bridgeMat,
    430,
    2,
    430
  );

  for(let i=-4;i<=4;i++){

    box(
      8,
      13,
      5,
      concreteMat,
      430+i*25,
      6,
      408
    );

    box(
      8,
      13,
      5,
      concreteMat,
      430+i*25,
      6,
      452
    );
  }
}

function createTemple(x,z){

  const stone = mat(0xc39a58);

  box(
    65,
    25,
    50,
    stone,
    x,
    12.5,
    z
  );

  const tower = new THREE.Mesh(
    new THREE.ConeGeometry(
      23,
      55,
      5
    ),
    stone
  );

  tower.position.set(
    x,
    52,
    z
  );

  tower.castShadow=true;

  scene.add(tower);

  cylinder(
    3,
    18,
    mat(0x8c342c),
    x,
    74,
    z
  );
}

function createFarm(){

  const farmMat = mat(0x7d9a43);

  for(let i=0;i<8;i++){

    const field = box(
      90,
      .15,
      35,
      farmMat,
      -650+i*105,
      .08,
      520
    );

    field.rotation.y = .05;
  }

  for(let i=0;i<10;i++){

    box(
      5,
      1,
      5,
      mat(0x71552e),
      -650+i*70,
      .6,
      460+Math.sin(i)*30
    );
  }
}

function createCity(){

  // Karauli City
  for(let x=-560;x<=-300;x+=55){

    for(let z=-390;z<=-150;z+=55){

      if(Math.random()>.12){
        createHouse(
          x+(Math.random()*12-6),
          z+(Math.random()*12-6),
          .85+Math.random()*.35
        );
      }
    }
  }

  // Old Town
  for(let i=0;i<16;i++){

    createHouse(
      -760+Math.random()*150,
      -10+Math.random()*170,
      .8+Math.random()*.3
    );
  }

  // Mandrayal
  for(let i=0;i<22;i++){

    createHouse(
      -470+Math.random()*230,
      340+Math.random()*170,
      .8+Math.random()*.3
    );
  }

  // Riverside
  for(let i=0;i<14;i++){

    createHouse(
      220+Math.random()*180,
      570+Math.random()*150,
      .8+Math.random()*.3
    );
  }
}

function createIndustrial(){

  createFactory(350,-420);

  createWarehouse(490,-350,80,55);
  createWarehouse(240,-350,80,55);

  for(let i=0;i<10;i++){

    cylinder(
      7,
      13,
      mat(0x777773),
      190+i*25,
      6.5,
      -480
    );
  }
}

function createPowerStation(){

  for(let i=0;i<5;i++){

    box(
      30,
      25,
      18,
      concreteMat,
      580+i*35,
      12.5,
      80
    );
  }

  for(let i=0;i<8;i++){

    box(
      4,
      45,
      4,
      mat(0x777777),
      550+i*25,
      22,
      150
    );
  }
}

function createHarbour(){

  const dockMat = mat(0x755e43);

  for(let i=0;i<5;i++){

    box(
      110,
      2,
      20,
      dockMat,
      620,
      2,
      330+i*30
    );
  }

  // containers
  const containerColors = [
    0x9b4939,
    0x496d7d,
    0x807145,
    0x6a596e
  ];

  for(let i=0;i<18;i++){

    box(
      25,
      15,
      12,
      mat(containerColors[i%4]),
      520+Math.random()*210,
      8,
      300+Math.random()*150
    );
  }
}

function createRoadNetwork(){

  createRoad(
    -100,
    -20,
    1550,
    45,
    0
  );

  createRoad(
    -250,
    -20,
    45,
    1100,
    0
  );

  createRoad(
    300,
    -100,
    45,
    1100,
    .15
  );

  createRoad(
    100,
    350,
    1050,
    40,
    -.28
  );

  createRoad(
    -550,
    380,
    650,
    38,
    .08
  );

  createRoad(
    500,
    250,
    500,
    35,
    .55
  );
}

function createPlayer(){

  player = new THREE.Group();

  player.position.set(
    -50,
    1,
    0
  );

  // legs
  const legMat = mat(0x26313a);
  const shirtMat = mat(0x3d5c69);
  const skinMat = mat(0xb97b54);

  const leftLeg = box(
    5,
    13,
    5,
    legMat,
    0,
    7,
    -3
  );

  const rightLeg = box(
    5,
    13,
    5,
    legMat,
    0,
    7,
    3
  );

  leftLeg.position.x=-3;
  rightLeg.position.x=3;

  const body = box(
    14,
    20,
    10,
    shirtMat,
    0,
    22,
    0
  );

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(7,16,12),
    skinMat
  );

  head.position.set(0,38,0);
  head.castShadow=true;

  player.add(
    leftLeg,
    rightLeg,
    body,
    head
  );

  // backpack
  box(
    9,
    13,
    5,
    mat(0x353b3d),
    0,
    23,
    7
  );

  scene.add(player);
}

function setupScene(){

  scene = new THREE.Scene();

  scene.background = new THREE.Color(0x9fc4d1);

  scene.fog = new THREE.Fog(
    0x9fc4d1,
    650,
    1900
  );

  camera = new THREE.PerspectiveCamera(
    65,
    innerWidth/innerHeight,
    .1,
    2500
  );

  renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
  );

  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  document.getElementById("game").appendChild(
    renderer.domElement
  );

  clock = new THREE.Clock();

  const hemi = new THREE.HemisphereLight(
    0xddefff,
    0x43503d,
    2
  );

  scene.add(hemi);

  const sun = new THREE.DirectionalLight(
    0xffe1b0,
    3
  );

  sun.position.set(
    -500,
    900,
    -500
  );

  sun.castShadow=true;

  sun.shadow.mapSize.width=2048;
  sun.shadow.mapSize.height=2048;

  sun.shadow.camera.left=-1000;
  sun.shadow.camera.right=1000;
  sun.shadow.camera.top=1000;
  sun.shadow.camera.bottom=-1000;

  scene.add(sun);

  createGround();
  createHills();
  createRoadNetwork();
  createCity();
  createIndustrial();
  createPowerStation();
  createHarbour();
  createTemple(80,430);
  createFarm();
  createBridge();
  createTrees();
  createPlayer();

  loading.style.display="none";

  drawMap();
  animate();
}

function updatePlayer(dt){

  let x=0;
  let z=0;

  if(keys.w)z-=1;
  if(keys.s)z+=1;
  if(keys.a)x-=1;
  if(keys.d)x+=1;

  x += joystick.x;
  z += joystick.y;

  const length=Math.hypot(x,z);

  if(length>1){
    x/=length;
    z/=length;
  }

  const speed=95;

  const forward = new THREE.Vector3(
    -Math.sin(yaw),
    0,
    -Math.cos(yaw)
  );

  const right = new THREE.Vector3(
    Math.cos(yaw),
    0,
    -Math.sin(yaw)
  );

  const move = new THREE.Vector3();

  move.addScaledVector(
    forward,
    -z
  );

  move.addScaledVector(
    right,
    x
  );

  if(move.lengthSq()>0){

    move.normalize();

    player.position.addScaledVector(
      move,
      speed*dt
    );

    player.rotation.y =
      Math.atan2(
        move.x,
        move.z
      );

    // walking animation
    const t=performance.now()*.012;

    player.children[0].rotation.x=
      Math.sin(t)*.35;

    player.children[1].rotation.x=
      -Math.sin(t)*.35;
  }

  // Island boundary
  const maxX=830;
  const maxZ=640;

  player.position.x=
    THREE.MathUtils.clamp(
      player.position.x,
      -maxX,
      maxX
    );

  player.position.z=
    THREE.MathUtils.clamp(
      player.position.z,
      -maxZ,
      maxZ
    );

  updateCamera();
  updateLocation();
}

function updateCamera(){

  const distance=115;
  const height=65;

  const target = new THREE.Vector3(
    player.position.x,
    player.position.y+25,
    player.position.z
  );

  const camX =
    player.position.x -
    Math.sin(yaw)*distance;

  const camZ =
    player.position.z -
    Math.cos(yaw)*distance;

  camera.position.set(
    camX,
    player.position.y+height,
    camZ
  );

  camera.lookAt(target);
}

function updateLocation(){

  let nearest=null;
  let distance=Infinity;

  locations.forEach(loc=>{

    const d=Math.hypot(
      player.position.x-loc.x,
      player.position.z-loc.z
    );

    if(d<distance){
      distance=d;
      nearest=loc;
    }
  });

  if(nearest && distance<180){
    locationText.textContent=
      nearest.name.toUpperCase();
  }else{
    locationText.textContent=
      "KARAULI ISLAND";
  }
}

function drawMap(){

  const ctx=mapCtx;

  ctx.clearRect(
    0,
    0,
    290,
    290
  );

  ctx.fillStyle="#2a6878";
  ctx.fillRect(0,0,290,290);

  // island
  ctx.beginPath();

  ctx.ellipse(
    145,
    145,
    125,
    100,
    0,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#5b8742";
  ctx.fill();

  // roads
  ctx.strokeStyle="#514c43";
  ctx.lineWidth=7;

  ctx.beginPath();
  ctx.moveTo(20,145);
  ctx.lineTo(270,145);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(105,35);
  ctx.lineTo(105,255);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(50,210);
  ctx.lineTo(235,70);
  ctx.stroke();

  // locations
  locations.forEach(loc=>{

    const mx =
      145 + loc.x/1800*240;

    const mz =
      145 + loc.z/1400*200;

    ctx.fillStyle="#e6b84a";

    ctx.beginPath();
    ctx.arc(
      mx,
      mz,
      4,
      0,
      Math.PI*2
    );

    ctx.fill();
  });
}

function updateMapPlayer(){

  if(!player)return;

  const x =
    145 + player.position.x/1800*240;

  const z =
    145 + player.position.z/1400*200;

  const ctx=mapCtx;

  ctx.fillStyle="#ff3030";

  ctx.beginPath();

  ctx.arc(
    x,
    z,
    6,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.strokeStyle="white";
  ctx.lineWidth=2;
  ctx.stroke();
}

function animate(){

  requestAnimationFrame(animate);

  const dt=Math.min(
    clock.getDelta(),
    .05
  );

  if(player){
    updatePlayer(dt);
    updateMapPlayer();
  }

  renderer.render(
    scene,
    camera
  );
}
