<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DESI DROP - Working 3D Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79a8c2;touch-action:none;font-family:Arial}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#start{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#142330;color:#fff}
.panel{width:min(88%,400px);padding:30px;text-align:center;background:#10161c;border-radius:20px}
h1{margin:0 0 8px;font-size:38px}p{opacity:.8}
#enter{padding:16px 35px;border:0;border-radius:12px;background:#f0b400;font-size:19px;font-weight:900}
#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 3px #000}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}
.badge{background:#0008;padding:8px 10px;border-radius:9px;font-weight:bold}
#cross{position:absolute;left:50%;top:50%;font-size:28px;transform:translate(-50%,-50%)}
#hint{position:absolute;top:57px;left:50%;transform:translateX(-50%);background:#0007;padding:7px 10px;border-radius:9px;white-space:nowrap}
#joy{position:absolute;left:20px;bottom:25px;width:125px;height:125px;border:2px solid #fff6;border-radius:50%;background:#fff2;pointer-events:auto}
#stick{position:absolute;width:54px;height:54px;left:33px;top:33px;border-radius:50%;background:#fff7}
.btn{position:absolute;pointer-events:auto;width:58px;height:58px;border-radius:50%;border:2px solid #fff7;background:#0008;color:#fff;font-weight:bold}
#fire{right:25px;bottom:42px;width:72px;height:72px;background:#a52222cc}
#jump{right:108px;bottom:105px}#run{left:165px;bottom:42px}#crouch{right:180px;bottom:42px}#reload{right:30px;bottom:120px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start"><div class="panel">
<h1>DESI DROP</h1>
<p>WORKING 3D CONTROLLER TEST</p>
<p>Character + joystick + 360° camera + target</p>
<button id="enter">ENTER ISLAND</button>
</div></div>
<div id="hud">
<div id="top"><div class="badge">DESI DROP • TEST</div><div class="badge">AMMO <span id="ammo">30</span></div></div>
<div id="hint">ENTER → then move the LEFT joystick</div>
<div id="cross">+</div>
<div id="joy"><div id="stick"></div></div>
<button class="btn" id="fire">FIRE</button>
<button class="btn" id="jump">JUMP</button>
<button class="btn" id="run">RUN</button>
<button class="btn" id="crouch">CROUCH</button>
<button class="btn" id="reload">↻</button>
</div>

<script>
"use strict";

/* ---------- tiny software 3D renderer ---------- */
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize);resize();

const objects=[];
function addCube(x,y,z,w,h,d,color){
 objects.push({type:"cube",x,y,z,w,h,d,color});
}
function addSphere(x,y,z,r,color){
 objects.push({type:"sphere",x,y,z,r,color});
}

/* Static world is created ONCE, not every frame. */
addCube(0,-2,0,500,4,500,"#477d45");
addCube(0,-.02,0,500,.08,9,"#45484a");
addCube(0,-.01,0,9,.08,500,"#45484a");

/* simple road markings */
for(let x=-220;x<=220;x+=20)addCube(x,.05,0,8,.03,.25,"#d4bd67");
for(let z=-220;z<=220;z+=20)addCube(0,.05,z,.25,.03,8,"#d4bd67");

/* buildings */
[
 [-70,2,-55,22,4,16],[-35,2,-55,18,4,14],[55,2,-50,24,4,16],
 [90,2,25,20,4,15],[-75,2,65,24,4,16],[35,2,75,18,4,14]
].forEach(a=>addCube(a[0],a[1],a[2],a[3],a[4],a[5],"#b79d78"));

/* trees */
for(let i=0;i<28;i++){
 const x=((i*71)%400)-200,z=((i*113)%360)-180;
 addCube(x,2,z,.7,4,.7,"#65452b");
 addSphere(x,6,z,3,"#2f6634");
}

/* training target */
addCube(20,1.1,0,1.2,2.2,.55,"#a72b2b");
addSphere(20,2.65,0,.48,"#d08f6b");
addCube(20,.4,0,.15,.8,.15,"#555b60");
addCube(20,.05,0,1.3,.1,1.3,"#242629");

/* player state */
let px=0,py=0,pz=18;
let yaw=0,pitch=.18,vy=0;
let grounded=true,running=false,crouched=false,started=false;
let ammo=30;

/* input */
const keys={};
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.code==="Space")jump();if(e.key.toLowerCase()==="r")reload()});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let jx=0,jy=0,jActive=false;
const joy=document.getElementById("joy"),stick=document.getElementById("stick");
function joySet(e){
 const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let x=e.clientX-cx,y=e.clientY-cy,l=Math.hypot(x,y),m=48;
 if(l>m){x=x/l*m;y=y/l*m}
 jx=x/m;jy=y/m;stick.style.transform=`translate(${x}px,${y}px)`;
}
joy.addEventListener("pointerdown",e=>{jActive=true;joy.setPointerCapture(e.pointerId);joySet(e)});
joy.addEventListener("pointermove",e=>{if(jActive)joySet(e)});
function joyOff(){jActive=false;jx=0;jy=0;stick.style.transform="translate(0,0)"}
joy.addEventListener("pointerup",joyOff);joy.addEventListener("pointercancel",joyOff);

/* right side camera swipe — 360° */
let look=false,lx=0,ly=0;
canvas.addEventListener("pointerdown",e=>{
 if(e.clientX>innerWidth*.35){look=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)}
});
canvas.addEventListener("pointermove",e=>{
 if(!look)return;
 yaw-=(e.clientX-lx)*.012;
 pitch-=(e.clientY-ly)*.008;
 pitch=Math.max(-.85,Math.min(.85,pitch));
 lx=e.clientX;ly=e.clientY;
});
canvas.addEventListener("pointerup",()=>look=false);
canvas.addEventListener("pointercancel",()=>look=false);

function jump(){if(grounded){vy=7;grounded=false}}
function reload(){ammo=30;document.getElementById("ammo").textContent=ammo}
function fire(){if(ammo>0){ammo--;document.getElementById("ammo").textContent=ammo}}

document.getElementById("enter").addEventListener("click",()=>{
 started=true;
 document.getElementById("start").style.display="none";
 document.getElementById("hint").textContent="LEFT = MOVE • RIGHT SWIPE = 360° LOOK";
});
document.getElementById("fire").addEventListener("pointerdown",fire);
document.getElementById("jump").addEventListener("pointerdown",jump);
document.getElementById("reload").addEventListener("pointerdown",reload);
document.getElementById("run").addEventListener("pointerdown",e=>{running=!running;e.currentTarget.textContent=running?"STOP":"RUN"});
document.getElementById("crouch").addEventListener("pointerdown",e=>{crouched=!crouched;e.currentTarget.textContent=crouched?"STAND":"CROUCH"});

/* camera projection */
function project(x,y,z){
 const sy=Math.sin(yaw),cy=Math.cos(yaw);
 let dx=x-px,dz=z-pz;
 let camX=dx*cy-dz*sy;
 let camZ=dx*sy+dz*cy;
 let camY=y-(py+1.35);
 const cp=Math.cos(pitch),sp=Math.sin(pitch);
 const yy=camY*cp-camZ*sp;
 const zz=camY*sp+camZ*cp;
 if(zz<=.15)return null;
 const f=(scoped?1.45:1.0)*Math.min(W,H);
 return {x:W/2+camX*f/zz,y:H/2-yy*f/zz,z:zz,scale:f/zz};
}
let scoped=false;
document.getElementById("hint").addEventListener("dblclick",()=>{});
function drawWorld(){
 const visible=[];
 for(const o of objects){
   const q=project(o.x,o.y,o.z);if(q)visible.push({o,q});
 }
 visible.sort((a,b)=>b.q.z-a.q.z);
 for(const {o,q} of visible){
   if(o.type==="cube"){
     const w=o.w*q.scale/2,h=o.h*q.scale,d=o.d*q.scale;
     ctx.fillStyle=o.color;
     ctx.fillRect(q.x-w,q.y-h/2,w*2,h);
     ctx.fillStyle="rgba(0,0,0,.16)";
     ctx.fillRect(q.x-w,q.y+h/2,w*2,Math.max(2,d*.08));
   }else{
     ctx.fillStyle=o.color;
     ctx.beginPath();ctx.arc(q.x,q.y,o.r*q.scale,0,Math.PI*2);ctx.fill();
   }
 }
}
function drawPlayer(){
 const q=project(px,py+1.35,pz);if(!q)return;
 const s=q.scale;
 /* shadow */
 ctx.fillStyle="rgba(0,0,0,.25)";ctx.beginPath();ctx.ellipse(q.x,q.y+1.25*s,1.0*s,.28*s,0,0,Math.PI*2);ctx.fill();
 /* legs */
 ctx.fillStyle="#171b22";
 ctx.fillRect(q.x-.43*s,q.y+.25*s,.34*s,.95*s);
 ctx.fillRect(q.x+.09*s,q.y+.25*s,.34*s,.95*s);
 /* torso */
 ctx.fillStyle="#263e67";
 ctx.fillRect(q.x-.62*s,q.y-.65*s,1.24*s,1.05*s);
 /* shoulders */
 ctx.fillStyle="#304b78";
 ctx.fillRect(q.x-.78*s,q.y-.57*s,1.56*s,.35*s);
 /* arms */
 ctx.fillStyle="#263e67";
 ctx.fillRect(q.x-.92*s,q.y-.42*s,.25*s,.85*s);
 ctx.fillRect(q.x+.67*s,q.y-.42*s,.25*s,.85*s);
 /* hands */
 ctx.fillStyle="#c88c69";
 ctx.beginPath();ctx.arc(q.x-.79*s,q.y+.45*s,.16*s,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.arc(q.x+.79*s,q.y+.45*s,.16*s,0,Math.PI*2);ctx.fill();
 /* neck + head */
 ctx.fillStyle="#c88c69";ctx.fillRect(q.x-.16*s,q.y-1.02*s,.32*s,.28*s);
 ctx.beginPath();ctx.arc(q.x,q.y-1.28*s,.43*s,0,Math.PI*2);ctx.fill();
 /* hair */
 ctx.fillStyle="#17191c";ctx.beginPath();ctx.arc(q.x,q.y-1.45*s,.44*s,Math.PI,Math.PI*2);ctx.fill();
 /* rifle */
 ctx.strokeStyle="#17191b";ctx.lineWidth=Math.max(2,5*s);ctx.beginPath();
 ctx.moveTo(q.x-.55*s,q.y+.10*s);ctx.lineTo(q.x+.65*s,q.y+.55*s);ctx.stroke();
}
function update(dt){
 let f=(keys.w?1:0)-(keys.s?1:0)-jy;
 let st=(keys.d?1:0)-(keys.a?1:0)+jx;
 const l=Math.hypot(f,st);if(l>1){f/=l;st/=l}
 const speed=running?14:(crouched?5:9);
 const fx=Math.sin(yaw),fz=Math.cos(yaw);
 const rx=Math.cos(yaw),rz=-Math.sin(yaw);
 px+=(fx*f+rx*st)*speed*dt;
 pz+=(fz*f+rz*st)*speed*dt;
 px=Math.max(-235,Math.min(235,px));pz=Math.max(-235,Math.min(235,pz));
 vy-=18*dt;py+=vy*dt;
 if(py<=0){py=0;vy=0;grounded=true}
}
function frame(){
 if(started)update(Math.min(.04,(performance.now()-frame.last)/1000));
 frame.last=performance.now();
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#78a8c2";ctx.fillRect(0,0,W,H);
 drawWorld();
 drawPlayer();
 requestAnimationFrame(frame);
}
frame.last=performance.now();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
