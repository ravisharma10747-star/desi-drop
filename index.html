<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DESI DROP</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#10160f;
  font-family:Arial,sans-serif;
  touch-action:none
}

canvas{
  display:block;
  width:100%;
  height:100%;
  background:#8ab35b
}

button{
  font:900 18px Arial;
  border:0;
  border-radius:14px;
  padding:16px 28px;
  background:#20b45a;
  color:white;
  box-shadow:0 5px 0 #087638;
  touch-action:manipulation
}

.screen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:linear-gradient(#172015dd,#080b08ee);
  color:white;
  text-align:center;
  z-index:20
}

.screen h1{
  font-size:54px;
  margin:0 0 6px;
  letter-spacing:3px
}

.screen p{
  margin:0 0 24px;
  color:#c9d8c5
}

.hidden{
  display:none!important
}

.hud{
  position:fixed;
  z-index:5;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  color:white;
  font-weight:900;
  text-shadow:0 2px 3px #000;
  pointer-events:none
}

.hud .box{
  background:#0008;
  padding:8px 10px;
  border-radius:10px
}

.controls{
  position:fixed;
  inset:0;
  z-index:6;
  pointer-events:none
}

.joy{
  position:absolute;
  left:24px;
  bottom:28px;
  width:118px;
  height:118px;
  border-radius:50%;
  background:#0004;
  border:2px solid #fff5;
  pointer-events:auto
}

.stick{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:#fff7;
  left:31px;
  top:31px
}

.fire,
.heal,
.reload{
  position:absolute;
  border-radius:50%;
  color:white;
  font-weight:900;
  pointer-events:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:2px solid #fff5
}

.fire{
  right:28px;
  bottom:42px;
  width:92px;
  height:92px;
  background:#c52c28aa
}

.heal{
  right:132px;
  bottom:112px;
  width:60px;
  height:60px;
  background:#219653aa;
  font-size:12px
}

.reload{
  right:126px;
  bottom:38px;
  width:70px;
  height:50px;
  border-radius:14px;
  background:#333b
}

.help{
  position:fixed;
  z-index:5;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  color:#fff9;
  font-size:11px;
  pointer-events:none
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="startScreen" class="screen">
  <h1>DESI DROP</h1>
  <p>Indian farm • village • highway • battle royale trial</p>
  <button id="startBtn" onclick="startGame()">PLAY TRIAL</button>
</div>

<div id="endScreen" class="screen hidden">
  <h1 id="endTitle">GAME OVER</h1>
  <p id="endText"></p>
  <button id="restartBtn" onclick="startGame()">PLAY AGAIN</button>
</div>

<div class="hud">
  <div class="box">
    ❤️ <span id="hp">100</span>
    &nbsp;
    🔫 <span id="ammo">30</span>
  </div>

  <div class="box">
    ☠️ <span id="kills">0</span>
    &nbsp;
    👥 <span id="left">11</span>
  </div>
</div>

<div class="controls">

  <div id="joy" class="joy">
    <div id="stick" class="stick"></div>
  </div>

  <div id="fire" class="fire">
    FIRE
  </div>

  <div id="heal" class="heal">
    MED<br>+30
  </div>

  <div id="reload" class="reload">
    RELOAD
  </div>

</div>

<div class="help">
  Move: joystick / WASD • Aim: tap screen • Fire: FIRE button / Space
</div>

<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const startScreen = document.getElementById('startScreen');
const endScreen = document.getElementById('endScreen');

const hpEl = document.getElementById('hp');
const ammoEl = document.getElementById('ammo');
const killsEl = document.getElementById('kills');
const leftEl = document.getElementById('left');

const joy = document.getElementById('joy');
const stick = document.getElementById('stick');
const fireBtn = document.getElementById('fire');
const healBtn = document.getElementById('heal');
const reloadBtn = document.getElementById('reload');

let W = innerWidth;
let H = innerHeight;
let DPR = Math.min(devicePixelRatio || 1,2);

let running = false;
let last = 0;
let shooting = false;

let keys = {};

const world = {
  w:2400,
  h:1800
};

let cam = {
  x:0,
  y:0
};

let player;
let bots = [];
let bullets = [];
let loot = [];
let trees = [];
let houses = [];
let particles = [];

let safe = {
  x:1200,
  y:900,
  r:900,
  target:900,
  timer:0
};

let aim = {
  x:1,
  y:0
};

let joyVec = {
  x:0,
  y:0
};


function resize(){

  W = innerWidth;
  H = innerHeight;

  DPR = Math.min(devicePixelRatio || 1,2);

  canvas.width = W * DPR;
  canvas.height = H * DPR;

  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener('resize',resize);

resize();


function rnd(a,b){
  return a + Math.random() * (b-a);
}


function dist(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}


function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}


/* MAP */

function makeMap(){

  trees = [];
  houses = [];

  for(let i=0;i<100;i++){

    trees.push({
      x:rnd(50,world.w-50),
      y:rnd(50,world.h-50),
      r:rnd(9,17)
    });

  }

  for(let i=0;i<28;i++){

    houses.push({
      x:rnd(100,world.w-160),
      y:rnd(100,world.h-120),
      w:rnd(65,105),
      h:rnd(45,75),
      c:i%3
    });

  }

}


/* LOOT */

function spawnLoot(){

  loot = [];

  for(let i=0;i<28;i++){

    loot.push({
      x:rnd(80,world.w-80),
      y:rnd(80,world.h-80),
      type:Math.random()<.62 ? 'ammo' : 'med',
      active:true
    });

  }

}


/* START GAME */

function startGame(){

  running = true;

  startScreen.classList.add('hidden');
  endScreen.classList.add('hidden');

  player = {
    x:world.w/2,
    y:world.h/2,
    r:18,
    hp:100,
    ammo:30,
    maxAmmo:30,
    med:2,
    kills:0,
    cool:0,
    speed:240
  };


  bots = [];

  for(let i=0;i<10;i++){

    let a = Math.random()*Math.PI*2;
    let d = rnd(500,800);

    bots.push({

      x:player.x + Math.cos(a)*d,
      y:player.y + Math.sin(a)*d,

      r:17,
      hp:100,
      ammo:99,

      cool:rnd(.2,1),

      dir:Math.random()*6.28,

      wander:rnd(1,4),

      speed:rnd(90,125),

      dead:false

    });

  }


  bullets = [];
  particles = [];

  safe = {
    x:world.w/2,
    y:world.h/2,
    r:900,
    target:900,
    timer:0
  };

  makeMap();
  spawnLoot();

  last = performance.now();

  requestAnimationFrame(loop);

  updateHud();
}


/* END */

function endGame(win){

  if(!running) return;

  running = false;

  document.getElementById('endTitle').textContent =
    win ? '🏆 WINNER!' : '💀 GAME OVER';

  document.getElementById('endText').textContent =
    win
    ? 'You survived DESI DROP with '+player.kills+' kills.'
    : 'You were eliminated with '+player.kills+' kills.';

  endScreen.classList.remove('hidden');

}


/* MOVEMENT */

function moveEntity(e,dx,dy,dt){

  e.x = clamp(
    e.x + dx*e.speed*dt,
    e.r,
    world.w-e.r
  );

  e.y = clamp(
    e.y + dy*e.speed*dt,
    e.r,
    world.h-e.r
  );

}


/* SHOOT */

function shoot(owner,dx,dy){

  if(owner===player && player.ammo<=0)
    return;

  if(owner.cool>0)
    return;

  owner.cool = owner===player ? 0.14 : 0.55;

  if(owner===player)
    player.ammo--;

  let speed = owner===player ? 700 : 520;

  bullets.push({

    x:owner.x+dx*20,
    y:owner.y+dy*20,

    vx:dx*speed,
    vy:dy*speed,

    owner:owner,

    life:1.4,

    damage:owner===player ? 25 : 10

  });

}


/* PLAYER */

function playerUpdate(dt){

  let dx =
    (keys.a || keys.ArrowLeft ? -1 : 0) +
    (keys.d || keys.ArrowRight ? 1 : 0) +
    joyVec.x;

  let dy =
    (keys.w || keys.ArrowUp ? -1 : 0) +
    (keys.s || keys.ArrowDown ? 1 : 0) +
    joyVec.y;

  let m = Math.hypot(dx,dy);

  if(m){

    dx/=m;
    dy/=m;

    moveEntity(player,dx,dy,dt);

  }

  player.cool = Math.max(0,player.cool-dt);

  if(shooting)
    shoot(player,aim.x,aim.y);

}


/* BOTS */

function botUpdate(b,dt){

  if(b.dead)
    return;

  b.cool = Math.max(0,b.cool-dt);

  let d = dist(b,player);

  let dx = 0;
  let dy = 0;

  if(d<650){

    dx = (player.x-b.x)/d;
    dy = (player.y-b.y)/d;

    if(d>300)
      moveEntity(b,dx,dy,dt);

    if(d<500)
      shoot(b,dx,dy);

  }else{

    b.wander -= dt;

    if(b.wander<0){

      b.wander = rnd(1,3);
      b.dir = rnd(0,6.28);

    }

    moveEntity(
      b,
      Math.cos(b.dir),
      Math.sin(b.dir),
      dt
    );

  }

  if(dist(b,safe)>safe.r)
    b.hp -= 8*dt;

}


/* BULLETS */

function bulletsUpdate(dt){

  for(let i=bullets.length-1;i>=0;i--){

    let q = bullets[i];

    q.x += q.vx*dt;
    q.y += q.vy*dt;

    q.life -= dt;

    let hit = null;


    if(q.owner===player){

      for(const b of bots){

        if(
          !b.dead &&
          Math.hypot(q.x-b.x,q.y-b.y)<b.r+5
        ){

          hit=b;
          break;

        }

      }

    }else{

      if(
        Math.hypot(q.x-player.x,q.y-player.y)
        < player.r+5
      ){

        hit=player;

      }

    }


    if(hit){

      hit.hp -= q.damage;

      particles.push({
        x:q.x,
        y:q.y,
        t:.3
      });


      if(hit!==player && hit.hp<=0){

        hit.dead=true;

        player.kills++;

        dropLoot(hit.x,hit.y);

      }


      if(hit===player && player.hp<=0)
        endGame(false);


      bullets.splice(i,1);

      continue;

    }


    if(
      q.life<=0 ||
      q.x<0 ||
      q.y<0 ||
      q.x>world.w ||
      q.y>world.h
    ){

      bullets.splice(i,1);

    }

  }

}


/* DROP LOOT */

function dropLoot(x,y){

  if(Math.random()<.7){

    loot.push({

      x:x,
      y:y,

      type:
        Math.random()<.65
        ? 'ammo'
        : 'med',

      active:true

    });

  }

}


/* LOOT */

function lootUpdate(){

  for(const l of loot){

    if(!l.active)
      continue;

    if(
      Math.hypot(
        l.x-player.x,
        l.y-player.y
      )<30
    ){

      l.active=false;

      if(l.type==='ammo'){

        player.ammo =
          Math.min(
            player.maxAmmo,
            player.ammo+15
          );

      }else{

        player.med =
          Math.min(
            3,
            player.med+1
          );

      }

    }

  }

}


/* SAFE ZONE */

function zoneUpdate(dt){

  safe.timer += dt;

  if(safe.timer>20){

    safe.timer=0;

    safe.target =
      Math.max(
        180,
        safe.target-130
      );

  }

  safe.r +=
    (safe.target-safe.r)*dt*.15;


  if(dist(player,safe)>safe.r)
    player.hp -= 7*dt;

}


/* UPDATE */

function update(dt){

  playerUpdate(dt);

  for(const b of bots)
    botUpdate(b,dt);

  bulletsUpdate(dt);

  lootUpdate();

  zoneUpdate(dt);


  for(let i=particles.length-1;i>=0;i--){

    particles[i].t -= dt;

    if(particles[i].t<=0)
      particles.splice(i,1);

  }


  if(bots.every(b=>b.dead))
    endGame(true);

  updateHud();

}


/* HUD */

function updateHud(){

  if(!player)
    return;

  hpEl.textContent =
    Math.max(0,Math.ceil(player.hp));

  ammoEl.textContent =
    player.ammo;

  killsEl.textContent =
    player.kills;

  leftEl.textContent =
    bots.filter(b=>!b.dead).length+1;

}


/* DRAW */

function draw(){

  ctx.clearRect(0,0,W,H);

  if(!player){

    ctx.fillStyle='#789d50';
    ctx.fillRect(0,0,W,H);

    return;

  }


  cam.x = clamp(
    player.x-W/2,
    0,
    world.w-W
  );

  cam.y = clamp(
    player.y-H/2,
    0,
    world.h-H
  );


  ctx.save();

  ctx.translate(
    -cam.x,
    -cam.y
  );


  drawMap();

  drawLoot();

  drawZone();


  for(const b of bots){

    if(!b.dead)
      drawChar(b,'#d84b3e');

  }


  drawChar(
    player,
    '#1685e8'
  );


  for(const q of bullets){

    ctx.fillStyle='#ffe16a';

    ctx.beginPath();

    ctx.arc(
      q.x,
      q.y,
      4,
      0,
      7
    );

    ctx.fill();

  }


  for(const p of particles){

    ctx.fillStyle='#fff';

    ctx.globalAlpha=p.t/.3;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      10,
      0,
      7
    );

    ctx.fill();

    ctx.globalAlpha=1;

  }


  ctx.restore();

}


/* MAP DRAW */

function drawMap(){

  ctx.fillStyle='#79a952';
  ctx.fillRect(
    0,
    0,
    world.w,
    world.h
  );


  /* HIGHWAY */

  ctx.fillStyle='#c7ad72';

  ctx.fillRect(
    0,
    790,
    world.w,
    170
  );


  /* CROSS ROAD */

  ctx.fillStyle='#d5c58c';

  ctx.fillRect(
    1080,
    0,
    170,
    world.h
  );


  /* ROAD MARKINGS */

  ctx.fillStyle='#8b7a55';

  ctx.fillRect(
    0,
    865,
    world.w,
    20
  );

  ctx.fillRect(
    1165,
    0,
    20,
    world.h
  );


  /* FIELDS */

  for(let x=70;x<world.w;x+=260){

    ctx.fillStyle='#9bc96b';

    ctx.fillRect(
      x,
      100,
      (x%520)+150,
      350
    );

    ctx.fillRect(
      x+50,
      125,
      (x%400)+120,
      300
    );

  }


  /* HOUSES */

  for(const h of houses){

    ctx.fillStyle='#e5d0a0';

    ctx.fillRect(
      h.x,
      h.y,
      h.w,
      h.h
    );


    ctx.fillStyle =
      ['#9d3b2e','#6c4935','#536b3c'][h.c];

    ctx.beginPath();

    ctx.moveTo(
      h.x-8,
      h.y
    );

    ctx.lineTo(
      h.x+h.w/2,
      h.y-28
    );

    ctx.lineTo(
      h.x+h.w+8,
      h.y
    );

    ctx.closePath();

    ctx.fill();

  }


  /* TREES */

  for(const t of trees){

    ctx.fillStyle='#67462d';

    ctx.fillRect(
      t.x-3,
      t.y,
      t.r/3,
      t.r
    );


    ctx.fillStyle='#245e2d';

    ctx.beginPath();

    ctx.arc(
      t.x,
      t.y,
      t.r,
      0,
      7
    );

    ctx.fill();

  }

}


/* LOOT DRAW */

function drawLoot(){

  for(const l of loot){

    if(!l.active)
      continue;

    ctx.fillStyle =
      l.type==='ammo'
      ? '#f0c33b'
      : '#37b96c';

    ctx.fillRect(
      l.x-9,
      l.y-9,
      18,
      18
    );

    ctx.fillStyle='#222';

    ctx.font='12px Arial';

    ctx.textAlign='center';

    ctx.fillText(
      l.type==='ammo'?'A':'M',
      l.x,
      l.y+4
    );

  }

}


/* ZONE DRAW */

function drawZone(){

  ctx.strokeStyle='#6f39ff';

  ctx.lineWidth=7;

  ctx.globalAlpha=.8;

  ctx.beginPath();

  ctx.arc(
    safe.x,
    safe.y,
    safe.r,
    0,
    7
  );

  ctx.stroke();

  ctx.globalAlpha=1;

}


/* CHARACTER */

function drawChar(e,c){

  ctx.fillStyle='#0005';

  ctx.beginPath();

  ctx.arc(
    e.x+3,
    e.y+4,
    e.r,
    0,
    7
  );

  ctx.fill();


  ctx.fillStyle=c;

  ctx.beginPath();

  ctx.arc(
    e.x,
    e.y,
    e.r,
    0,
    7
  );

  ctx.fill();


  let a =
    e===player
    ? Math.atan2(aim.y,aim.x)
    : Math.atan2(
        player.y-e.y,
        player.x-e.x
      );


  ctx.strokeStyle='#222';

  ctx.lineWidth=7;

  ctx.beginPath();

  ctx.moveTo(
    e.x,
    e.y
  );

  ctx.lineTo(
    e.x+Math.cos(a)*25,
    e.y+Math.sin(a)*25
  );

  ctx.stroke();


  /* HP BAR */

  ctx.fillStyle='#111';

  ctx.fillRect(
    e.x-18,
    e.y-e.r-11,
    36,
    5
  );

  ctx.fillStyle='#55d66b';

  ctx.fillRect(
    e.x-18,
    e.y-e.r-11,
    36*Math.max(0,e.hp/100),
    5
  );

}


/* GAME LOOP */

function loop(t){

  let dt =
    Math.min(
      .033,
      (t-last)/1000 || 0
    );

  last=t;

  if(running)
    update(dt);

  draw();

  requestAnimationFrame(loop);

}


/* AIM */

function setAim(x,y){

  const wx=x+cam.x;
  const wy=y+cam.y;

  let dx=wx-player.x;
  let dy=wy-player.y;

  let m=Math.hypot(dx,dy)||1;

  aim.x=dx/m;
  aim.y=dy/m;

}


/* KEYBOARD */

addEventListener(
  'keydown',
  e=>{

    keys[e.key]=true;

    if(e.code==='Space'){

      shooting=true;
      e.preventDefault();

    }

    if(
      e.key.toLowerCase()==='r' &&
      player
    ){

      player.ammo=player.maxAmmo;

    }

  }
);


addEventListener(
  'keyup',
  e=>{

    keys[e.key]=false;

    if(e.code==='Space')
      shooting=false;

  }
);


/* SCREEN AIM */

canvas.addEventListener(
  'pointerdown',
  e=>{

    if(running){

      setAim(
        e.clientX,
        e.clientY
      );

      shooting=true;

    }

  }
);


canvas.addEventListener(
  'pointermove',
  e=>{

    if(
      running &&
      e.buttons
    ){

      setAim(
        e.clientX,
        e.clientY
      );

    }

  }
);


canvas.addEventListener(
  'pointerup',
  ()=>shooting=false
);


/* FIRE BUTTON */

fireBtn.addEventListener(
  'pointerdown',
  e=>{

    e.preventDefault();

    shooting=true;

  }
);


fireBtn.addEventListener(
  'pointerup',
  ()=>shooting=false
);


fireBtn.addEventListener(
  'pointercancel',
  ()=>shooting=false
);


/* MEDKIT */

healBtn.addEventListener(
  'pointerdown',
  e=>{

    e.preventDefault();

    if(
      player &&
      player.med>0 &&
      player.hp<100
    ){

      player.hp=
        Math.min(
          100,
          player.hp+30
        );

      player.med--;

    }

  }
);


/* RELOAD */

reloadBtn.addEventListener(
  'pointerdown',
  e=>{

    e.preventDefault();

    if(player)
      player.ammo=player.maxAmmo;

  }
);


/* JOYSTICK */

let joyActive=false;


function joyMove(e){

  const r=joy.getBoundingClientRect();

  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;

  let dx=e.clientX-cx;
  let dy=e.clientY-cy;

  let m=Math.hypot(dx,dy);

  let max=45;

  if(m>max){

    dx=dx/m*max;
    dy=dy/m*max;

  }


  joyVec.x=dx/max;
  joyVec.y=dy/max;


  stick.style.transform=
    'translate('+dx+'px,'+dy+'px)';

}


joy.addEventListener(
  'pointerdown',
  e=>{

    joyActive=true;

    joy.setPointerCapture(
      e.pointerId
    );

    joyMove(e);

  }
);


joy.addEventListener(
  'pointermove',
  e=>{

    if(joyActive)
      joyMove(e);

  }
);


function resetJoy(){

  joyActive=false;

  joyVec.x=0;
  joyVec.y=0;

  stick.style.transform=
    'translate(0,0)';

}


joy.addEventListener(
  'pointerup',
  resetJoy
);

joy.addEventListener(
  'pointercancel',
  resetJoy
);

</script>

</body>
