<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>DESI DROP</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:absolute;
  inset:0;
}

canvas{
  display:block;
}

#menu{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,#283a45 0%,#111820 45%,#070b0e 100%);
  color:white;
  text-align:center;
}

.menuBox{
  width:min(90%,430px);
}

.logo{
  font-size:48px;
  font-weight:900;
  letter-spacing:6px;
  text-shadow:0 5px 15px #000;
}

.subtitle{
  margin-top:5px;
  margin-bottom:32px;
  color:#bbb;
  font-size:14px;
  letter-spacing:2px;
}

#play{
  width:100%;
  height:58px;
  border:0;
  border-radius:12px;
  background:#f2bb3f;
  color:#111;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
}

#play:active{
  transform:scale(.97);
}

#error{
  display:none;
  margin-top:18px;
  color:#ff7777;
  font-size:13px;
}

#hud{
  display:none;
  position:absolute;
  inset:0;
  z-index:10;
  pointer-events:none;
}

#gameLogo{
  position:absolute;
  top:14px;
  left:16px;
  color:white;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 2px 6px #000;
}

#place{
  position:absolute;
  top:40px;
  left:16px;
  color:white;
  font-size:12px;
  text-shadow:0 2px 5px #000;
}

#mini{
  position:absolute;
  top:12px;
  right:12px;
  width:150px;
  height:150px;
  background:rgba(15,50,55,.85);
  border:3px solid white;
  border-radius:9px;
}

#miniCanvas{
  width:100%;
  height:100%;
}

#joystick{
  position:absolute;
  left:22px;
  bottom:25px;
  width:145px;
  height:145px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.22);
  pointer-events:auto;
}

#knob{
  position:absolute;
  width:58px;
  height:58px;
  left:41px;
  top:41px;
  border-radius:50%;
  background:rgba(255,255,255,.55);
  border:2px solid white;
}

#lookArea{
  position:absolute;
  right:0;
  bottom:0;
  width:58%;
  height:75%;
  pointer-events:auto;
}

#tip{
  position:absolute;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  padding:9px 14px;
  color:white;
  background:rgba(0,0,0,.45);
  border-radius:8px;
  font-size:12px;
  white-space:nowrap;
}

#desktop{
  display:none;
}

@media(min-width:700px){
  #desktop{
    display:block;
    position:absolute;
    right:20px;
    bottom:20px;
    padding:10px 15px;
    color:white;
    background:rgba(0,0,0,.45);
    border-radius:8px;
    font-size:13px;
  }

  #tip{
    display:none;
  }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="menu">

  <div class="menuBox">

    <div class="logo">DESI DROP</div>

    <div class="subtitle">
      CLASSIC BATTLE ROYALE
    </div>

    <button id="play">
      ENTER ISLAND
    </button>

    <div id="error">
      Game could not start. Please reload the page.
    </div>

  </div>

</div>

<div id="hud">

  <div id="gameLogo">DESI DROP</div>

  <div id="place">KARAULI ISLAND</div>

  <div id="mini">
    <canvas id="miniCanvas"
    width="300"
    height="300"></canvas>
  </div>

  <div id="joystick">
    <div id="knob"></div>
  </div>

  <div id="lookArea"></div>

  <div id="tip">
    JOYSTICK = MOVE • DRAG RIGHT SIDE = LOOK
  </div>

  <div id="desktop">
    W A S D = MOVE • DRAG MOUSE = LOOK
  </div>

</div>


<!--
  SIMPLE THREE.JS
  No ES modules.
-->
<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>


<script>

(function(){

"use strict";

let scene;
let camera;
let renderer;
let player;
let clock;

let gameStarted=false;

let yaw=0;

const keys={
  w:false,
  a:false,
  s:false,
  d:false
};

const joy={
  active:false,
  id:null,
  x:0,
  y:0
};

const look={
  active:false,
  id:null,
  x:0,
  y:0
};


/* =========================
   BASIC MATERIALS
========================= */

function material(color){

  return new THREE.MeshStandardMaterial({
    color:color,
    roughness:.9
  });

}

const grass=material(0x56803f);
const grass2=material(0x466c35);
const road=material(0x41413e);
const dirt=material(0x967348);
const wall=material(0xc4a87b);
const roof=material(0x814b35);
const dark=material(0x303536);
const concrete=material(0x777873);
const treeTrunk=material(0x624329);
const leaves=material(0x2d6332);

const water=new THREE.MeshStandardMaterial({
  color:0x236d82,
  roughness:.35,
  metalness:.1,
  transparent:true,
  opacity:.9
});


/* =========================
   OBJECT HELPERS
========================= */

function box(
  w,h,d,
  mat,
  x,y,z
){

  const m=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    mat
  );

  m.position.set(x,y,z);

  m.castShadow=true;
  m.receiveShadow=true;

  scene.add(m);

  return m;
}


function cylinder(
  r,h,
  mat,
  x,y,z
){

  const m=new THREE.Mesh(
    new THREE.CylinderGeometry(
      r,r,h,12
    ),
    mat
  );

  m.position.set(x,y,z);

  m.castShadow=true;
  m.receiveShadow=true;

  scene.add(m);

  return m;
}


/* =========================
   ISLAND
========================= */

function makeIsland(){

  const island=new THREE.Mesh(
    new THREE.CylinderGeometry(
      900,
      900,
      8,
      48
    ),
    grass
  );

  island.scale.z=.75;
  island.position.y=-2;

  island.receiveShadow=true;

  scene.add(island);


  const beach=new THREE.Mesh(
    new THREE.CylinderGeometry(
      930,
      930,
      2,
      48
    ),
    material(0xc8b276)
  );

  beach.scale.z=.75;
  beach.position.y=-1;

  scene.add(beach);


  const sea=new THREE.Mesh(
    new THREE.PlaneGeometry(
      2400,
      2100
    ),
    water
  );

  sea.rotation.x=-Math.PI/2;
  sea.position.y=-4;

  scene.add(sea);

}


/* =========================
   ROADS
========================= */

function makeRoad(
  x,z,w,d,rot
){

  const r=box(
    w,
    .15,
    d,
    road,
    x,
    .08,
    z
  );

  r.rotation.y=rot||0;

}


/* =========================
   HOUSE
========================= */

function makeHouse(
  x,z,s
){

  s=s||1;

  const w=30*s;
  const d=25*s;
  const h=18*s;

  box(
    w,h,d,
    wall,
    x,h/2,z
  );


  const r=new THREE.Mesh(
    new THREE.ConeGeometry(
      23*s,
      13*s,
      4
    ),
    roof
  );

  r.rotation.y=Math.PI/4;
  r.position.set(
    x,
    h+6*s,
    z
  );

  r.castShadow=true;

  scene.add(r);


  box(
    6*s,
    10*s,
    1,
    dark,
    x,
    5*s,
    z-d/2
  );


  box(
    6*s,
    5*s,
    1,
    material(0x294d5c),
    x-w*.25,
    10*s,
    z-d/2-.5
  );


  box(
    6*s,
    5*s,
    1,
    material(0x294d5c),
    x+w*.25,
    10*s,
    z-d/2-.5
  );

}


/* =========================
   WAREHOUSE
========================= */

function warehouse(
  x,z,w,d
){

  box(
    w,
    32,
    d,
    concrete,
    x,
    16,
    z
  );

  box(
    w+3,
    4,
    d+3,
    dark,
    x,
    34,
    z
  );


  for(
    let i=-1;
    i<=1;
    i++
  ){

    box(
      16,
      22,
      1,
      dark,
      x+i*25,
      11,
      z-d/2
    );

  }

}


/* =========================
   FACTORY
========================= */

function factory(x,z){

  warehouse(
    x,z,
    125,
    75
  );


  cylinder(
    17,
    65,
    concrete,
    x+72,
    32,
    z
  );


  cylinder(
    13,
    5,
    dark,
    x+72,
    66,
    z
  );

}


/* =========================
   TREES
========================= */

function trees(){

  for(
    let i=0;
    i<150;
    i++
  ){

    const a=Math.random()*Math.PI*2;
    const r=150+Math.random()*700;

    const x=Math.cos(a)*r;
    const z=Math.sin(a)*r*.72;

    if(
      Math.abs(x)<120 &&
      Math.abs(z)<120
    ){
      i--;
      continue;
    }


    cylinder(
      2.2,
      12,
      treeTrunk,
      x,
      6,
      z
    );


    const crown=new THREE.Mesh(
      new THREE.SphereGeometry(
        9+Math.random()*5,
        8,
        7
      ),
      leaves
    );

    crown.position.set(
      x,
      17,
      z
    );

    crown.castShadow=true;

    scene.add(crown);

  }

}


/* =========================
   HILLS
========================= */

function hills(){

  const positions=[
    [-650,-500,130],
    [-500,-530,100],
    [-50,-520,145],
    [300,-510,120],
    [580,-300,110],
    [600,260,135],
    [50,510,160],
    [-500,420,120]
  ];


  positions.forEach(
    function(p){

      const h=new THREE.Mesh(
        new THREE.SphereGeometry(
          p[2],
          20,
          12
        ),
        grass2
      );

      h.scale.y=.5;

      h.position.set(
        p[0],
        p[2]*.2,
        p[1]
      );

      h.castShadow=true;
      h.receiveShadow=true;

      scene.add(h);

    }
  );

}


/* =========================
   CITY
========================= */

function city(){

  /* KARAULI CITY */

  for(
    let x=-560;
    x<=-300;
    x+=52
  ){

    for(
      let z=-390;
      z<=-160;
      z+=52
    ){

      makeHouse(
        x+(Math.random()*10-5),
        z+(Math.random()*10-5),
        .85+Math.random()*.3
      );

    }

  }


  /* OLD TOWN */

  for(
    let i=0;
    i<20;
    i++
  ){

    makeHouse(
      -790+Math.random()*170,
      -30+Math.random()*190,
      .8+Math.random()*.3
    );

  }


  /* MANDRAYAL */

  for(
    let i=0;
    i<22;
    i++
  ){

    makeHouse(
      -500+Math.random()*250,
      350+Math.random()*160,
      .8+Math.random()*.3
    );

  }


  /* RIVERSIDE */

  for(
    let i=0;
    i<15;
    i++
  ){

    makeHouse(
      180+Math.random()*240,
      540+Math.random()*150,
      .8+Math.random()*.3
    );

  }

}


/* =========================
   INDUSTRIAL AREA
========================= */

function industrial(){

  factory(
    330,
    -420
  );

  warehouse(
    500,
    -340,
    90,
    55
  );

  warehouse(
    210,
    -340,
    90,
    55
  );


  for(
    let i=0;
    i<10;
    i++
  ){

    cylinder(
      7,
      12,
      concrete,
      180+i*30,
      6,
      -500
    );

  }

}


/* =========================
   TEMPLE
========================= */

function temple(){

  const stone=material(0xc69e5c);

  box(
    65,
    25,
    50,
    stone,
    70,
    12.5,
    420
  );


  const tower=new THREE.Mesh(
    new THREE.ConeGeometry(
      22,
      55,
      5
    ),
    stone
  );

  tower.position.set(
    70,
    52,
    420
  );

  tower.castShadow=true;

  scene.add(tower);

}


/* =========================
   HARBOUR
========================= */

function harbour(){

  for(
    let i=0;
    i<5;
    i++
  ){

    box(
      110,
      2,
      20,
      dirt,
      630,
      2,
      320+i*30
    );

  }


  const colors=[
    0x984d3e,
    0x456d7d,
    0x807045,
    0x65536d
  ];


  for(
    let i=0;
    i<18;
    i++
  ){

    box(
      25,
      15,
      12,
      material(colors[i%4]),
      530+Math.random()*210,
      8,
      290+Math.random()*160
    );

  }

}


/* =========================
   FARM
========================= */

function farm(){

  const field=material(0x789442);

  for(
    let i=0;
    i<8;
    i++
  ){

    box(
      90,
      .2,
      35,
      field,
      -650+i*105,
      .1,
      520
    );

  }

}


/* =========================
   BRIDGE
========================= */

function bridge(){

  box(
    250,
    4,
    45,
    concrete,
    440,
    3,
    430
  );


  for(
    let i=-5;
    i<=5;
    i++
  ){

    box(
      7,
      14,
      5,
      concrete,
      440+i*23,
      7,
      407
    );


    box(
      7,
      14,
      5,
      concrete,
      440+i*23,
      7,
      453
    );

  }

}


/* =========================
   PLAYER
========================= */

function makePlayer(){

  player=new THREE.Group();

  player.position.set(
    -40,
    1,
    0
  );


  const bodyMat=material(0x385a68);
  const pantsMat=material(0x293036);
  const skinMat=material(0xb87850);


  const leftLeg=box(
    5,
    13,
    5,
    pantsMat,
    -3,
    7,
    0
  );


  const rightLeg=box(
    5,
    13,
    5,
    pantsMat,
    3,
    7,
    0
  );


  const body=box(
    14,
    20,
    10,
    bodyMat,
    0,
    22,
    0
  );


  const head=new THREE.Mesh(
    new THREE.SphereGeometry(
      7,
      16,
      12
    ),
    skinMat
  );

  head.position.set(
    0,
    38,
    0
  );

  head.castShadow=true;


  const backpack=box(
    9,
    14,
    5,
    dark,
    0,
    23,
    7
  );


  player.add(
    leftLeg,
    rightLeg,
    body,
    head,
    backpack
  );


  scene.add(player);

}


/* =========================
   SCENE
========================= */

function setup(){

  scene=new THREE.Scene();

  scene.background=
    new THREE.Color(0x9fc8db);

  scene.fog=new THREE.Fog(
    0x9fc8db,
    650,
    1900
  );


  camera=new THREE.PerspectiveCamera(
    65,
    window.innerWidth/
    window.innerHeight,
    .1,
    2500
  );


  renderer=new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });


  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );


  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      1.5
    )
  );


  renderer.shadowMap.enabled=true;


  document
    .getElementById("game")
    .appendChild(renderer.domElement);


  clock=new THREE.Clock();


  const light=new THREE.HemisphereLight(
    0xddeeff,
    0x40533b,
    2
  );

  scene.add(light);


  const sun=new THREE.DirectionalLight(
    0xffdfad,
    3
  );

  sun.position.set(
    -500,
    900,
    -500
  );

  sun.castShadow=true;

  sun.shadow.mapSize.width=1024;
  sun.shadow.mapSize.height=1024;

  scene.add(sun);


  makeIsland();

  hills();

  makeRoad(
    -100,
    -20,
    1550,
    45,
    0
  );

  makeRoad(
    -250,
    -20,
    45,
    1100,
    0
  );

  makeRoad(
    300,
    -80,
    45,
    1100,
    .15
  );

  makeRoad(
    80,
    350,
    1050,
    40,
    -.28
  );

  makeRoad(
    -550,
    380,
    650,
    38,
    .08
  );

  city();

  industrial();

  temple();

  harbour();

  farm();

  bridge();

  trees();

  makePlayer();


  document.getElementById("menu")
    .style.display="none";

  document.getElementById("hud")
    .style.display="block";

  gameStarted=true;

  animate();

}


/* =========================
   CAMERA
========================= */

function updateCamera(){

  const distance=115;

  const height=65;

  camera.position.x=
    player.position.x-
    Math.sin(yaw)*distance;

  camera.position.z=
    player.position.z-
    Math.cos(yaw)*distance;

  camera.position.y=
    player.position.y+height;


  camera.lookAt(
    player.position.x,
    player.position.y+23,
    player.position.z
  );

}


/* =========================
   MOVEMENT
========================= */

function move(dt){

  let x=0;
  let z=0;


  if(keys.w)z-=1;
  if(keys.s)z+=1;
  if(keys.a)x-=1;
  if(keys.d)x+=1;


  x+=joy.x;
  z+=joy.y;


  const length=Math.hypot(x,z);


  if(length>1){

    x/=length;
    z/=length;

  }


  if(
    Math.abs(x)>.01 ||
    Math.abs(z)>.01
  ){

    const forward=new THREE.Vector3(
      -Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );


    const right=new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );


    const direction=new THREE.Vector3();


    direction.addScaledVector(
      forward,
      -z
    );


    direction.addScaledVector(
      right,
      x
    );


    if(direction.lengthSq()>0){

      direction.normalize();


      player.position.addScaledVector(
        direction,
        95*dt
      );


      player.rotation.y=
        Math.atan2(
          direction.x,
          direction.z
        );


      const t=
        performance.now()*.012;


      player.children[0]
        .rotation.x=
        Math.sin(t)*.3;


      player.children[1]
        .rotation.x=
        -Math.sin(t)*.3;

    }

  }


  player.position.x=
    THREE.MathUtils.clamp(
      player.position.x,
      -820,
      820
    );


  player.position.z=
    THREE.MathUtils.clamp(
      player.position.z,
      -620,
      620
    );


  updateCamera();

  updatePlace();

}


/* =========================
   LOCATION
========================= */

const places=[
  ["KARAULI CITY",-420,-270],
  ["OLD TOWN",-720,80],
  ["INDUSTRIAL YARD",330,-420],
  ["MANDRAYAL VILLAGE",-360,420],
  ["TEMPLE HILLS",70,420],
  ["HARBOUR",650,430],
  ["RIVERSIDE",300,650],
  ["FARM BELT",-620,500],
  ["DRY VALLEY",650,-550]
];


function updatePlace(){

  let best=null;
  let distance=99999;


  places.forEach(
    function(p){

      const d=Math.hypot(
        player.position.x-p[1],
        player.position.z-p[2]
      );


      if(d<distance){

        distance=d;
        best=p;

      }

    }
  );


  if(best && distance<180){

    document.getElementById(
      "place"
    ).textContent=best[0];

  }else{

    document.getElementById(
      "place"
    ).textContent=
      "KARAULI ISLAND";

  }

}


/* =========================
   MINIMAP
========================= */

const mc=
  document.getElementById(
    "miniCanvas"
  );

const ctx=mc.getContext("2d");


function drawMini(){

  ctx.clearRect(
    0,0,300,300
  );


  ctx.fillStyle="#286b7b";

  ctx.fillRect(
    0,0,300,300
  );


  ctx.beginPath();

  ctx.ellipse(
    150,
    150,
    128,
    102,
    0,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#588744";

  ctx.fill();


  ctx.strokeStyle="#4a4840";

  ctx.lineWidth=7;


  ctx.beginPath();

  ctx.moveTo(20,150);
  ctx.lineTo(280,150);

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(105,35);
  ctx.lineTo(105,265);

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(40,220);
  ctx.lineTo(250,70);

  ctx.stroke();


  places.forEach(
    function(p){

      const x=
        150+p[1]/1800*250;

      const y=
        150+p[2]/1400*200;

    r.left+r.width/2;

    r.top+r.height/2;

  }

    "translate("+dx+"px,"+
    dy+"px)";


  joy.x=dx/max;
  joy.y=dy/max;

}
