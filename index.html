<style>
*{

html,body{
  margin:0;

#game{

}

canvas{

#menu{
  position:fixed;
  inset:0;

  display:flex;

  background:
    radial-gradient(circle at 50% 40%,#263a45,#111920 48%,#05080a 100%);

.menuBox{
  width:min(90%,430px);
}

.logo{

.subtitle{

#play{

  transform:scale(.97);

#status{

#hud{

#brand{

}

#place{
  position:absolute;
  top:41px;

  color:white;
  font-size:12px;

}

#mini{
  position:absolute;

  right:12px;

  border:3px solid rgba(255,255,255,.9);

  background:#276878;

#miniCanvas{

}

#joystick{

  background:rgba(0,0,0,.24);

}

#knob{
  position:absolute;

}

#look{

}

#tip{

  left:50%;

}

@media(min-width:700px){

<script type="module">

import * as THREE from "three";


/* =========================================================
   BASIC STATE
========================================================= */

const menu =
  document.getElementById("menu");

const hud =
  document.getElementById("hud");

const game =
  document.getElementById("game");

const play =
  document.getElementById("play");

const status =
  document.getElementById("status");

const errorBox =
  document.getElementById("error");

const placeText =
  document.getElementById("place");


let scene;
let camera;
let renderer;
let player;
let clock;

let running=false;

let yaw=0;

const keys={
  w:false,
  a:false,
  s:false,
  d:false
};

const joy={
  active:false,
  id:null,
  x:0,
  y:0
};

const look={
  active:false,
  id:null,
  x:0,
  y:0
};


/* =========================================================
   MATERIALS
========================================================= */

function material(color){

  return new THREE.MeshStandardMaterial({
    color,
    roughness:.9,
    metalness:0
  });

}

const MAT={

  grass:material(0x5a8442),

  grassDark:material(0x426b36),

  sand:material(0xc8b477),

  road:material(0x3f403e),

  wall:material(0xc4a675),

  roof:material(0x824936),

  concrete:material(0x777976),

  dark:material(0x303536),

  tree:material(0x2e6633),

  trunk:material(0x604329),

  field:material(0x789342),

  temple:material(0xc49a58),

  blue:material(0x355e70)

};

const waterMat =
  new THREE.MeshStandardMaterial({
    color:0x246d81,
    roughness:.3,
    metalness:.05,
    transparent:true,
    opacity:.92
  });


/* =========================================================
   HELPERS
========================================================= */

function addBox(
  w,h,d,
  mat,
  x,y,z
){

  const mesh =
    new THREE.Mesh(
      new THREE.BoxGeometry(w,h,d),
      mat
    );

  mesh.position.set(x,y,z);

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  scene.add(mesh);

  return mesh;
}


function addCylinder(
  r,h,
  mat,
  x,y,z
){

  const mesh =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        r,r,h,12
      ),
      mat
    );

  mesh.position.set(x,y,z);

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  scene.add(mesh);

  return mesh;
}


/* =========================================================
   ISLAND
========================================================= */

function createIsland(){

  const beach =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        930,
        930,
        4,
        48
      ),
      MAT.sand
    );

  beach.scale.z=.75;
  beach.position.y=-2;

  scene.add(beach);


  const island =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        900,
        900,
        8,
        48
      ),
      MAT.grass
    );

  island.scale.z=.75;
  island.position.y=1;

  island.receiveShadow=true;

  scene.add(island);


  const sea =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        2600,
        2300
      ),
      waterMat
    );

  sea.rotation.x=-Math.PI/2;
  sea.position.y=-6;

  scene.add(sea);

}


/* =========================================================
   ROADS
========================================================= */

function createRoad(
  x,z,w,d,rotation=0
){

  const r =
    addBox(
      w,
      .18,
      d,
      MAT.road,
      x,
      .12,
      z
    );

  r.rotation.y=rotation;

}


/* =========================================================
   HOUSE
========================================================= */

function createHouse(
  x,z,s=1
){

  const w=30*s;
  const d=25*s;
  const h=18*s;


  addBox(
    w,h,d,
    MAT.wall,
    x,h/2,z
  );


  const roof =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        23*s,
        13*s,
        4
      ),
      MAT.roof
    );

  roof.rotation.y=Math.PI/4;

  roof.position.set(
    x,
    h+6*s,
    z
  );

  roof.castShadow=true;

  scene.add(roof);


  addBox(
    6*s,
    10*s,
    1,
    MAT.dark,
    x,
    5*s,
    z-d/2-.5
  );


  const windowMat =
    material(0x315565);


  addBox(
    6*s,
    5*s,
    1,
    windowMat,
    x-w*.25,
    10*s,
    z-d/2-.6
  );


  addBox(
    6*s,
    5*s,
    1,
    windowMat,
    x+w*.25,
    10*s,
    z-d/2-.6
  );

}


/* =========================================================
   CITY
========================================================= */

function createCities(){

  /* Karauli City */

  for(
    let x=-560;
    x<=-300;
    x+=55
  ){

    for(
      let z=-390;
      z<=-160;
      z+=55
    ){

      createHouse(
        x+(Math.random()*12-6),
        z+(Math.random()*12-6),
        .85+Math.random()*.3
      );

    }

  }


  /* Old Town */

  for(let i=0;i<20;i++){

    createHouse(
      -790+Math.random()*170,
      -20+Math.random()*180,
      .8+Math.random()*.3
    );

  }


  /* Mandrayal */

  for(let i=0;i<22;i++){

    createHouse(
      -500+Math.random()*250,
      350+Math.random()*160,
      .8+Math.random()*.3
    );

  }


  /* Riverside */

  for(let i=0;i<15;i++){

    createHouse(
      180+Math.random()*240,
      540+Math.random()*150,
      .8+Math.random()*.3
    );

  }

}


/* =========================================================
   INDUSTRIAL AREA
========================================================= */

function createWarehouse(
  x,z,w=90,d=55
){

  addBox(
    w,
    32,
    d,
    MAT.concrete,
    x,
    16,
    z
  );


  addBox(
    w+4,
    4,
    d+4,
    MAT.dark,
    x,
    34,
    z
  );


  for(
    let i=-1;
    i<=1;
    i++
  ){

    addBox(
      16,
      22,
      1,
      MAT.dark,
      x+i*25,
      11,
      z-d/2-.5
    );

  }

}


function createFactory(){

  createWarehouse(
    330,
    -420,
    125,
    75
  );


  addCylinder(
    17,
    65,
    MAT.concrete,
    405,
    32,
    -420
  );


  addCylinder(
    13,
    5,
    MAT.dark,
    405,
    66,
    -420
  );


  createWarehouse(
    500,
    -340,
    90,
    55
  );


  createWarehouse(
    210,
    -340,
    90,
    55
  );

}


/* =========================================================
   POWER STATION
========================================================= */

function createPowerStation(){

  for(let i=0;i<5;i++){

    addBox(
      30,
      25,
      18,
      MAT.concrete,
      580+i*35,
      12.5,
      80
    );

  }


  for(let i=0;i<8;i++){

    addBox(
      4,
      45,
      4,
      MAT.concrete,
      550+i*25,
      22,
      150
    );

  }

}


/* =========================================================
   HARBOUR
========================================================= */

function createHarbour(){

  for(let i=0;i<5;i++){

    addBox(
      110,
      2,
      20,
      MAT.trunk,
      630,
      2,
      320+i*30
    );

  }


  const containerColors=[
    0x994c3d,
    0x466f80,
    0x837348,
    0x66546d
  ];


  for(let i=0;i<18;i++){

    addBox(
      25,
      15,
      12,
      material(
        containerColors[i%4]
      ),
      530+Math.random()*210,
      8,
      290+Math.random()*160
    );

  }

}


/* =========================================================
   TEMPLE
========================================================= */

function createTemple(){

  addBox(
    65,
    25,
    50,
    MAT.temple,
    70,
    12.5,
    420
  );


  const tower =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        23,
        55,
        5
      ),
      MAT.temple
    );

  tower.position.set(
    70,
    52,
    420
  );

  tower.castShadow=true;

  scene.add(tower);


  addCylinder(
    3,
    18,
    MAT.roof,
    70,
    78,
    420
  );

}


/* =========================================================
   FARM
========================================================= */

function createFarm(){

  for(let i=0;i<8;i++){

    addBox(
      90,
      .2,
      35,
      MAT.field,
      -650+i*105,
      .12,
      520
    );

  }

}


/* =========================================================
   BRIDGE
========================================================= */

function createBridge(){

  addBox(
    250,
    4,
    45,
    MAT.concrete,
    440,
    3,
    430
  );


  for(
    let i=-5;
    i<=5;
    i++
  ){

    addBox(
      7,
      14,
      5,
      MAT.concrete,
      440+i*23,
      7,
      407
    );


    addBox(
      7,
      14,
      5,
      MAT.concrete,
      440+i*23,
      7,
      453
    );

  }

}


/* =========================================================
   HILLS
========================================================= */

function createHills(){

  const data=[
    [-650,-500,130],
    [-500,-530,100],
    [-50,-520,145],
    [300,-510,120],
    [580,-300,110],
    [600,260,135],
    [50,510,160],
    [-500,420,120]
  ];


  data.forEach(
    p=>{

      const hill =
        new THREE.Mesh(
          new THREE.SphereGeometry(
            p[2],
            20,
            12
          ),
          MAT.grassDark
        );


      hill.scale.y=.5;

      hill.position.set(
        p[0],
        p[2]*.2,
        p[1]
      );

      hill.castShadow=true;
      hill.receiveShadow=true;

      scene.add(hill);

    }
  );

}


/* =========================================================
   TREES
========================================================= */

function createTrees(){

  for(let i=0;i<160;i++){

    const angle =
      Math.random()*Math.PI*2;

    const radius =
      150+Math.random()*700;


    const x=
      Math.cos(angle)*radius;

    const z=
      Math.sin(angle)*radius*.72;


    if(
      Math.abs(x)<120 &&
      Math.abs(z)<120
    ){

      i--;
      continue;

    }


    addCylinder(
      2.2,
      12,
      MAT.trunk,
      x,
      6,
      z
    );


    const crown =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          9+Math.random()*5,
          8,
          7
        ),
        MAT.tree
      );


    crown.position.set(
      x,
      17,
      z
    );


    crown.castShadow=true;

    scene.add(crown);

  }

}


/* =========================================================
   PLAYER
========================================================= */

function createPlayer(){

  player =
    new THREE.Group();


  player.position.set(
    -40,
    1,
    0
  );


  const bodyMat =
    material(0x36596a);

  const pantsMat =
    material(0x293137);

  const skinMat =
    material(0xb97b55);


  const leftLeg =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        5,13,5
      ),
      pantsMat
    );

  leftLeg.position.set(
    -3,7,0
  );


  const rightLeg =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        5,13,5
      ),
      pantsMat
    );

  rightLeg.position.set(
    3,7,0
  );


  const body =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        14,20,10
      ),
      bodyMat
    );

  body.position.y=22;


  const head =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        7,
        16,
        12
      ),
      skinMat
    );

  head.position.y=38;


  const backpack =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        9,14,5
      ),
      MAT.dark
    );

  backpack.position.set(
    0,23,7
  );


  player.add(
    leftLeg,
    rightLeg,
    body,
    head,
    backpack
  );


  player.traverse(
    obj=>{
      if(obj.isMesh){
        obj.castShadow=true;
        obj.receiveShadow=true;
      }
    }
  );


  scene.add(player);

}


/* =========================================================
   SCENE SETUP
========================================================= */

function createScene(){

  scene =
    new THREE.Scene();


  scene.background =
    new THREE.Color(0x9fc9dc);


  scene.fog =
    new THREE.Fog(
      0x9fc9dc,
      650,
      1900
    );


  camera =
    new THREE.PerspectiveCamera(
      65,
      innerWidth/innerHeight,
      .1,
      2500
    );


  renderer =
    new THREE.WebGLRenderer({
      antialias:true,
      powerPreference:"high-performance"
    });


  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      1.5
    )
  );


  renderer.setSize(
    innerWidth,
    innerHeight
  );


  renderer.shadowMap.enabled=true;

  renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;


  game.appendChild(
    renderer.domElement
  );


  clock =
    new THREE.Clock();


  /* LIGHT */

  const hemi =
    new THREE.HemisphereLight(
      0xddeeff,
      0x43523e,
      2
    );

  scene.add(hemi);


  const sun =
    new THREE.DirectionalLight(
      0xffdfad,
      3
    );

  sun.position.set(
    -500,
    900,
    -500
  );

  sun.castShadow=true;

  sun.shadow.mapSize.width=1024;
  sun.shadow.mapSize.height=1024;

  scene.add(sun);


  /* WORLD */

  createIsland();

  createHills();

  createRoad(
    -100,-20,
    1550,45
  );

  createRoad(
    -250,-20,
    45,1100
  );

  createRoad(
    300,-80,
    45,1100,.15
  );

  createRoad(
    80,350,
    1050,40,-.28
  );

  createRoad(
    -550,380,
    650,38,.08
  );

  createCities();

  createFactory();

  createPowerStation();

  createTemple();

  createHarbour();

  createFarm();

  createBridge();

  createTrees();

  createPlayer();


  updateCamera();

  drawMini();


  running=true;

  menu.style.display="none";

  hud.style.display="block";


  animate();

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

  if(!player)return;


  const distance=115;
  const height=65;


  camera.position.set(
    player.position.x-
      Math.sin(yaw)*distance,

    player.position.y+
      height,

    player.position.z-
      Math.cos(yaw)*distance
  );


  camera.lookAt(
    player.position.x,
    player.position.y+23,
    player.position.z
  );

}


/* =========================================================
   MOVEMENT
========================================================= */

function updateMovement(dt){

  if(!player)return;


  let x=0;
  let z=0;


  if(keys.w)z-=1;
  if(keys.s)z+=1;
  if(keys.a)x-=1;
  if(keys.d)x+=1;


  x+=joy.x;
  z+=joy.y;


  const len=
    Math.hypot(x,z);


  if(len>1){

    x/=len;
    z/=len;

  }


  if(
    Math.abs(x)>.01 ||
    Math.abs(z)>.01
  ){

    const forward =
      new THREE.Vector3(
        -Math.sin(yaw),
        0,
        -Math.cos(yaw)
      );


    const right =
      new THREE.Vector3(
        Math.cos(yaw),
        0,
        -Math.sin(yaw)
      );


    const direction =
      new THREE.Vector3();


    direction.addScaledVector(
      forward,
      -z
    );


    direction.addScaledVector(
      right,
      x
    );


    direction.normalize();


    player.position.addScaledVector(
      direction,
      95*dt
    );


    player.rotation.y =
      Math.atan2(
        direction.x,
        direction.z
      );


    const t =
      performance.now()*.012;


    player.children[0]
      .rotation.x=
      Math.sin(t)*.3;


    player.children[1]
      .rotation.x=
      -Math.sin(t)*.3;

  }


  player.position.x =
    THREE.MathUtils.clamp(
      player.position.x,
      -820,
      820
    );


  player.position.z =
    THREE.MathUtils.clamp(
      player.position.z,
      -620,
      620
    );


  updateCamera();

  updatePlace();

}


/* =========================================================
   LOCATIONS
========================================================= */

const locations=[

  ["KARAULI CITY",-420,-270],

  ["OLD TOWN",-720,80],

  ["INDUSTRIAL YARD",330,-420],

  ["POWER STATION",650,100],

  ["MANDRAYAL VILLAGE",-360,420],

  ["TEMPLE HILLS",70,420],

  ["HARBOUR",650,430],

  ["RIVERSIDE",300,650],

  ["FARM BELT",-620,500],

  ["DRY VALLEY",650,-550]
